<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f3ee">
<link rel="icon" href="core/favicon.svg" type="image/svg+xml">
<title>LLL Algebra</title>
<script src="core/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/brand.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-logo"><img src="core/logo.svg" alt="LLL"></span>
    <span class="brand-name" data-i18n="gameTitle">LLL Algebra</span>
  </div>
  <div class="topbar-controls">
    <div id="langHost"></div>
    <div id="themeHost"></div>
  </div>
</header>

<main class="stage">
  <div class="hud">
    <span data-i18n="scoreLabel">Score</span>&nbsp;<strong id="hudScore">0</strong>
    <span data-i18n="levelLabel">Level</span>&nbsp;<strong id="hudLevel">1 / 1</strong>
  </div>

  <div class="staircase-wrap">
    <svg id="staircase" class="staircase-svg" viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="equation-card">
    <p class="equation" id="equationText">x + 5 = 12</p>
  </div>

  <div class="choices" id="choicesGrid"></div>

  <div class="hint-text" id="hintText"></div>

  <div class="controls-row">
    <button class="hint-btn" id="hintBtn" data-i18n="hintBtn">Hint (−2 pts)</button>
    <button class="next-btn" id="nextBtn" data-i18n="nextBtn">Next equation →</button>
  </div>
</main>

<script src="core/i18n.js"></script>
<script type="module">
  import { LEVELS } from "./levels.js";

  // ---------- i18n ----------
  const STRINGS = {
    en: {
      brand: "LLL Algebra",
      gameTitle: "LLL Algebra",
      scoreLabel: "Score", levelLabel: "Level",
      hintBtn: "Hint (−2 pts)", nextBtn: "Next equation →",
      correctMsg: "Nice — that's the right move.",
      wrongMsg: "Not quite — try again.",
      solvedMsg: "Solved! x is isolated."
    },
    ja: {
      brand: "LLL 代数",
      gameTitle: "LLL 代数",
      scoreLabel: "スコア", levelLabel: "レベル",
      hintBtn: "ヒント (−2 pt)", nextBtn: "次の方程式 →",
      correctMsg: "正解です！",
      wrongMsg: "違います、もう一度。",
      solvedMsg: "解けました！x が求まりました。"
    }
  };
  LLL_I18N.init(STRINGS, { switcherHost: document.getElementById("langHost") });
  document.getElementById("themeHost").appendChild(LLL_THEME.button());

  // ---------- game state ----------
  let levelIndex = 0;
  let stepIndex = 0;
  let score = 0;
  let hintUsedThisStep = false;

  const $eq = document.getElementById("equationText");
  const $choices = document.getElementById("choicesGrid");
  const $hintText = document.getElementById("hintText");
  const $hintBtn = document.getElementById("hintBtn");
  const $nextBtn = document.getElementById("nextBtn");
  const $staircase = document.getElementById("staircase");
  const $hudScore = document.getElementById("hudScore");
  const $hudLevel = document.getElementById("hudLevel");

  function currentLevel() { return LEVELS[levelIndex]; }
  function currentStep() { return currentLevel().steps[stepIndex]; }

  // ---------- staircase signature element ----------
  const STAIR_GROUND_Y = 115, STAIR_STEP_H = 32, STAIR_STEP_W = 60, STAIR_START_X = 30;

  function buildStaircase(numSteps) {
    const totalWidth = STAIR_START_X + numSteps * STAIR_STEP_W + 30;
    $staircase.setAttribute("viewBox", `0 0 ${totalWidth} 140`);
    let blocks = "";
    for (let i = 1; i <= numSteps; i++) {
      const bx = STAIR_START_X + (i - 1) * STAIR_STEP_W;
      const by = STAIR_GROUND_Y - i * STAIR_STEP_H;
      const bh = i * STAIR_STEP_H;
      blocks += `<rect class="stair-block" x="${bx}" y="${by}" width="${STAIR_STEP_W - 4}" height="${bh}" rx="4"/>`;
    }
    const summitX = STAIR_START_X + (numSteps - 1) * STAIR_STEP_W + (STAIR_STEP_W - 4) / 2;
    const summitY = STAIR_GROUND_Y - numSteps * STAIR_STEP_H - 28;
    $staircase.innerHTML =
      `<line class="stair-ground" x1="0" y1="${STAIR_GROUND_Y}" x2="${totalWidth}" y2="${STAIR_GROUND_Y}"/>` +
      blocks +
      `<text class="stair-summit" id="stairSummit" x="${summitX}" y="${summitY}" text-anchor="middle">x</text>` +
      `<circle class="stair-marker" id="stairMarker" r="10"/>`;
  }

  function positionMarker(stepIdx, numSteps, solved) {
    const marker = document.getElementById("stairMarker");
    const summit = document.getElementById("stairSummit");
    if (!marker) return;
    let x, y;
    if (stepIdx <= 0) {
      x = STAIR_START_X - 15; y = STAIR_GROUND_Y - 9;
    } else {
      x = STAIR_START_X + (stepIdx - 1) * STAIR_STEP_W + (STAIR_STEP_W - 4) / 2;
      y = STAIR_GROUND_Y - stepIdx * STAIR_STEP_H - 9;
    }
    marker.setAttribute("cx", x);
    marker.setAttribute("cy", y);
    marker.classList.toggle("solved", !!solved);
    if (summit) summit.classList.toggle("solved", !!solved);
  }

  function shakeMarker() {
    const marker = document.getElementById("stairMarker");
    if (!marker) return;
    marker.classList.remove("shake");
    void marker.getBBox(); // restart animation
    marker.classList.add("shake");
  }

  function actionLabel(action, value) {
    const verbs = { add: "+", subtract: "−", multiply: "×", divide: "÷" };
    return `${verbs[action]} ${value} both sides`;
  }

  function makeDistractors(correctStep) {
    const actions = ["add", "subtract", "multiply", "divide"];
    const pool = [];
    actions.forEach(a => {
      [correctStep.value, correctStep.value + 1, correctStep.value - 1].forEach(v => {
        if (v > 0 && !(a === correctStep.action && v === correctStep.value)) {
          pool.push({ action: a, value: v });
        }
      });
    });
    // shuffle + take 3
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, 3);
  }

  function render() {
    const level = currentLevel();
    $eq.textContent = level.equation;
    $hudLevel.textContent = `${levelIndex + 1} / ${LEVELS.length}`;
    $hudScore.textContent = score;
    $hintText.textContent = "";
    $nextBtn.classList.remove("visible");
    buildStaircase(level.steps.length);
    positionMarker(stepIndex, level.steps.length, false);

    const step = currentStep();
    const choices = [{ action: step.action, value: step.value }, ...makeDistractors(step)];
    for (let i = choices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [choices[i], choices[j]] = [choices[j], choices[i]];
    }

    $choices.innerHTML = "";
    choices.forEach(choice => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = actionLabel(choice.action, choice.value);
      btn.addEventListener("click", () => handleChoice(choice, btn, step));
      $choices.appendChild(btn);
    });

    hintUsedThisStep = false;
  }

  function handleChoice(choice, btn, correctStep) {
    const isCorrect = choice.action === correctStep.action && choice.value === correctStep.value;
    [...$choices.children].forEach(b => b.disabled = true);

    if (isCorrect) {
      btn.classList.add("correct");
      $eq.textContent = correctStep.result;

      stepIndex++;
      const totalSteps = currentLevel().steps.length;
      const justSolved = stepIndex >= totalSteps;
      positionMarker(stepIndex, totalSteps, justSolved);

      if (justSolved) {
        score += currentLevel().basePoints;
        $hudScore.textContent = score;
        $hintText.textContent = LLL_I18N.t("solvedMsg") || "Solved!";
        $nextBtn.classList.add("visible");
      } else {
        setTimeout(render, 600);
      }
    } else {
      btn.classList.add("wrong");
      shakeMarker();
      $hintText.textContent = LLL_I18N.t("wrongMsg") || "Not quite — try again.";
      setTimeout(() => {
        [...$choices.children].forEach(b => { b.disabled = false; b.classList.remove("wrong"); });
      }, 700);
    }
  }

  $hintBtn.addEventListener("click", () => {
    const level = currentLevel();
    const hint = level.hints[stepIndex] || level.hints[level.hints.length - 1];
    $hintText.textContent = hint;
    if (!hintUsedThisStep) {
      score = Math.max(0, score - 2);
      $hudScore.textContent = score;
      hintUsedThisStep = true;
    }
  });

  $nextBtn.addEventListener("click", () => {
    levelIndex = (levelIndex + 1) % LEVELS.length;
    stepIndex = 0;
    render();
  });

  render();
</script>
</body>
</html>
