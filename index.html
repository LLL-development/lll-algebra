    let weakest = null, mostSlips = 1;   // nudge only at 2+ slips in one topic
    topics.forEach(tp => {
      const slips = marksByTopic[tp].filter(c => !c).length;
      if (slips > mostSlips) { mostSlips = slips; weakest = tp; }
    });
    const topicName = tp => t(TOPIC_LABEL_KEYS[tp], tp);
    const rows = topics.map(tp => `
      <div class="review-row">
        <span class="review-row-name">${topicName(tp)}</span>
        <span class="review-row-marks">${marksByTopic[tp].map(c =>
          `<span class="review-mark ${c ? "ok" : "slip"}">${c ? "✓" : "✗"}</span>`).join("")}</span>
      </div>`).join("");

    let footer = "";
    if (weakest) {
      footer = `
        <p class="review-nudge">${t("reviewNudge", "{topic} tripped you up a few times.").split("{topic}").join(topicName(weakest))}</p>
        <button class="complete-btn secondary review-practise-btn" data-topic="${weakest}">${
          t("reviewPractiseBtn", "Practise {topic} →").split("{topic}").join(topicName(weakest))}</button>`;
    } else if (flawless === results.length) {
      footer = `<p class="review-nudge">${t("reviewCleanSweep", "Clean sweep!")}</p>`;
    }
    $completeReview.innerHTML = `
      <p class="review-flawless">${t("reviewFlawless", "{n} / {total} flawless")
        .split("{n}").join(flawless).split("{total}").join(results.length)}</p>
      <div class="review-rows">${rows}</div>${footer}`;
    $completeReview.hidden = false;

    completeActions = { primary: () => go("#review"), levels: () => go("#home"), escape: () => go("#home") };
    $completePrimaryBtn.textContent = t("reviewAgainBtn", "Play again");
    $completeRetryBtn.hidden = true;
    $completeLevelsBtn.hidden = false;
    $completeLevelsBtn.textContent = t("homeBtn", "Home");
    $completeRetryBtn.parentElement.hidden = false;
    $completeWatchBtn.hidden = true;

    $completeKicker.classList.toggle("pixel", /^[\x20-\x7E]*$/.test($completeKicker.textContent));
    $completeOverlay.hidden = false;
    $completePrimaryBtn.focus({ preventScroll: true });
    const allClean = flawless === results.length;
    completeChalky("celebrating", allClean ? "chalkyReviewFlawless" : "chalkyReview", { n: results.length });
    burstGrandConfetti();   // any finished session gets confetti, not only a flawless one
  }

  $completeReview.addEventListener("click", (e) => {
    const btn = e.target.closest(".review-practise-btn");
    if (btn) go(`#levels/${btn.dataset.topic}`);
  });

  // ---------- Tricky spots: practice sessions ----------
  // A Mixed Review round with a `practice` field: no stars, hint and "Show me" still work.
  // Never touches reviewBest or the Mixed Review achievements.
  function startPractice(kind) {
    review = {
      levels: buildReviewQueue(practicePool(kind), PRACTICE_LENGTH),
      index: 0, score: 0, results: [],
      practice: { kind, startN: (mistakes[kind] || {}).n || 0 },
      slipped: new Set()   // question indexes with a slip of the practised kind
    };
    stepIndex = 0;
    render();
    buddyReact("happy", { line: buddyLine("trickyStartLine"), ms: 3200 });   // one line at the start only
  }

  function showPracticeSummary() {
    const t = (k, fb) => LLL_I18N.t(k) || fb;
    const { kind, startN } = review.practice;
    const total = review.levels.length;
    const clean = total - review.slipped.size;
    const endN = (mistakes[kind] || {}).n || 0;

    $completeKicker.textContent = t("trickyDone", "Practice done!");
    $completeSub.textContent = trickyLabel(kind);
    $completeStars.hidden = true;
    $completeBest.hidden = true;
    $completePoints.textContent = "";
    $completeBonus.hidden = true;
    $completeExplanation.hidden = true;
    clearSystemGraph();
    clearNumberLine();

    const rows = review.levels.map((l, i) => {
      const ok = !review.slipped.has(i);
      return `
      <div class="review-row">
        <span class="review-row-name tricky-q">${i + 1}. ${escapeHtml(l.equation.split("\n").join(", ")).replace(/\^([-−]?\d+)/g, '<span class="pow">$1</span>')}</span>
        <span class="review-row-marks"><span class="review-mark ${ok ? "ok" : "slip"}">${ok ? "✓" : "✗"}</span></span>
      </div>`;
    }).join("");
    $completeReview.innerHTML = `
      <p class="review-flawless">${t("trickyClean", "{n} / {total} without that slip")
        .split("{n}").join(clean).split("{total}").join(total)}</p>
      <div class="review-rows">${rows}</div>
      <p class="review-nudge">${t("trickySlipCount", "Slip count: {from} → {to}")
        .split("{from}").join(startN).split("{to}").join(endN)}</p>`;
    $completeReview.hidden = false;

    completeActions = { primary: () => go(`#tricky/${kind}`), levels: () => go("#home"), escape: () => go("#home") };
    $completePrimaryBtn.textContent = t("trickyAgainBtn", "Practise again");
    $completeRetryBtn.hidden = true;
    $completeLevelsBtn.hidden = false;
    $completeLevelsBtn.textContent = t("homeBtn", "Home");
    $completeRetryBtn.parentElement.hidden = false;
    $completeWatchBtn.hidden = true;

    $completeKicker.classList.toggle("pixel", /^[\x20-\x7E]*$/.test($completeKicker.textContent));
    $completeOverlay.hidden = false;
    $completePrimaryBtn.focus({ preventScroll: true });
    const allClean = clean === total;
    completeChalky(allClean ? "celebrating" : "happy", allClean ? "chalkyTrickyClean" : "chalkyTricky");
    if (allClean) burstGrandConfetti();
  }

  // ---------- level select ----------
  const TIERS = ["easy", "medium", "hard"];
  const TIER_LABEL_KEYS = { easy: "tierEasy", medium: "tierMedium", hard: "tierHard" };
  const TOPIC_LABEL_KEYS = { equation: "topicEquation", inequality: "topicInequality", brackets: "topicBrackets", quadratic: "topicQuadratic", system: "topicSystem", fraction: "topicFraction", subject: "topicSubject", expression: "topicExpression", indices: "topicIndices", roots: "topicRoots", line: "topicLine" };
  const TOPIC_SAMPLES = { equation: "x + 5 = 12", inequality: "-3x > 12", brackets: "2(x + 3) = 14", quadratic: "x² + 5x + 6 = 0", system: "x + y = 9\n2x - y = 3", fraction: "x/2 + x/3 = 5", subject: "y = 2x + 1", expression: "4x + 3 + 2x", indices: "x^3 × x^4", roots: "(x + 3)² = 16", line: "y = 2x + 3" };

  // Levels unlock in order within a tier; the first level of every tier is always open.
  function isUnlocked(level) {
    const list = levelsFor(level.topic, level.difficulty);
    const i = list.indexOf(level);
    return i <= 0 || !!levelProgress[list[i - 1].id];
  }

  function starSpans(stars) {
    return [1, 2, 3].map(n => `<span class="star${n <= stars ? " on" : ""}">★</span>`).join("");
  }

  function renderLevelSelect(topic) {
    const t = k => LLL_I18N.t(k);
    $levelsSample.textContent = "";
    appendWithPowers($levelsSample, TOPIC_SAMPLES[topic], "-");
    $levelsTitle.textContent = t(TOPIC_LABEL_KEYS[topic]) || topic;
    $levelsSummary.textContent = statsText(topicStats(topic));
    $levelsFormulaBtn.hidden = !hasFormulas(topic);
    $levelsTiers.innerHTML = "";

    TIERS.forEach(tier => {
      const list = levelsFor(topic, tier);
      if (!list.length) return;
      const tierStars = list.reduce((sum, l) => sum + ((levelProgress[l.id] || {}).stars || 0), 0);
      const nextLevel = list.find(l => !levelProgress[l.id] && isUnlocked(l));

      const block = document.createElement("div");
      block.className = "tier-block";
      block.innerHTML = `
        <div class="tier-block-head">
          <span class="tier-block-name">${t(TIER_LABEL_KEYS[tier]) || tier}</span>
          <span class="tier-block-meta">★ ${tierStars} / ${list.length * 3}</span>
        </div>
        <div class="level-grid"></div>`;
      const grid = block.querySelector(".level-grid");

      list.forEach((level, i) => {
        const result = levelProgress[level.id];
        const unlocked = isUnlocked(level);
        const tile = document.createElement("button");
        tile.className = "level-tile" +
          (result ? " cleared" : "") + (level === nextLevel ? " next" : "") + (unlocked ? "" : " locked");
        tile.dataset.level = level.id;
        tile.disabled = !unlocked;
        tile.setAttribute("aria-label",
          `${t("levelLabel") || "Level"} ${i + 1}` + (unlocked ? (result ? ` · ${result.stars}★` : "") : ` · ${t("lockedLabel") || "Locked"}`));
        tile.innerHTML = `
          <span class="level-tile-num">${i + 1}</span>
          <span class="level-tile-stars">${unlocked ? starSpans(result ? result.stars : 0) : "🔒"}</span>`;
        grid.appendChild(tile);
      });
      $levelsTiers.appendChild(block);
    });
  }

  $levelsTiers.addEventListener("click", (e) => {
    const tile = e.target.closest(".level-tile");
    if (!tile || tile.disabled) return;
    go(playHash(LEVELS_BY_ID[tile.dataset.level]));
  });

  $levelsBackBtn.addEventListener("click", () => go("#home"));

  function setBackLabel(key, fallback) {
    $backBtnLabel.dataset.i18n = key;
    $backBtnLabel.textContent = LLL_I18N.t(key) || fallback;
  }

  // ---------- home Chalky ----------
  // Lines are built from the player's progress, most useful first; tapping him moves to the next one.
  const homeBuddy = makeBuddy(document.getElementById("homeBuddy"), document.getElementById("homeBubble"), {
    keepBubble: true,
    idles: {
      delay: () => 6000 + Math.random() * 4000,   // one every 6–10 s
      pick: () => CHALKY_IDLES.home[Math.floor(Math.random() * CHALKY_IDLES.home.length)],
      canPlay: () => !$screenHome.hidden && !$introOverlay.classList.contains("show") && !document.hidden
    }
  });
  let homeLines = [];
  let homeLineIdx = 0;

  function buildHomeLines() {
    const t = k => LLL_I18N.t(k) || "";
    const fill = (s, vars) => Object.entries(vars).reduce((acc, [k, v]) => acc.split(`{${k}}`).join(v), s);
    const lines = [];
    const cleared = clearedLevels().length;

    // The first time the Tricky spots card appears, Chalky points it out (once ever)
    if (!$trickyCard.hidden && !trickyAnnounced) {
      lines.push(t("homeTrickyNew"));
      trickyAnnounced = true;
      try { localStorage.setItem(TRICKY_ANNOUNCED_KEY, "1"); } catch (e) { /* fail silently */ }
    }
    if (!cleared) lines.push(t("homeFirst"));
    if (!isDailyCompletedToday()) {
      lines.push(dailyStreak > 0 ? fill(t("homeDailyStreak"), { n: dailyStreak }) : t("homeDaily"));
    }
    const toUnlock = REVIEW_UNLOCK - cleared;
    if (cleared && toUnlock > 0 && toUnlock <= 5) lines.push(fill(t("homeReviewSoon"), { n: toUnlock }));

    // One tier that's started and nearly done (1–3 levels left)
    const almost = Object.keys(TOPIC_LABEL_KEYS).flatMap(topic => TIERS.map(tier => {
      const list = levelsFor(topic, tier);
      const done = list.filter(l => levelProgress[l.id]).length;
      return { topic, tier, done, left: list.length - done };
    })).find(x => x.done > 0 && x.left > 0 && x.left <= 3);
    if (almost) {
      lines.push(fill(t("homeAlmostTier"), {
        n: almost.left, topic: t(TOPIC_LABEL_KEYS[almost.topic]), tier: t(TIER_LABEL_KEYS[almost.tier])
      }));
    }

    // A topic they haven't touched yet, once they've started another
    const fresh = Object.keys(TOPIC_LABEL_KEYS).find(tp => !topicStats(tp).cleared);
    if (cleared && fresh) lines.push(fill(t("homeTryTopic"), { topic: t(TOPIC_LABEL_KEYS[fresh]) }));

    lines.push(...shuffled(t("homeCheer").split("|").filter(Boolean)));   // general encouragement as filler
    return lines.filter(Boolean);
  }

  // advance = false: rebuild from current progress and say the top line (arriving home, language switch)
  // advance = true: next line in the list (tapping Chalky)
  function homeSay(advance) {
    if (!advance || !homeLines.length) { homeLines = buildHomeLines(); homeLineIdx = 0; }
    else homeLineIdx = (homeLineIdx + 1) % homeLines.length;
    homeBuddy.react("happy", { line: homeLines[homeLineIdx], ms: 900 });
  }

  // "Tap me!" bubble above Chalky's head, shown until the first tap ever (remembered in the browser)
  const CHALKY_TAPPED_KEY = "lll_algebra_chalky_tapped";
  const $homeTapHint = document.getElementById("homeTapHint");
  let chalkyTapped = false;
  try { chalkyTapped = localStorage.getItem(CHALKY_TAPPED_KEY) === "1"; } catch (e) { /* fail silently */ }
  $homeTapHint.hidden = chalkyTapped;

  function onChalkyTap() {
    homeSay(true);
    if (chalkyTapped) return;
    chalkyTapped = true;
    $homeTapHint.hidden = true;
    try { localStorage.setItem(CHALKY_TAPPED_KEY, "1"); } catch (e) { /* fail silently */ }
  }

  // Tapping Chalky or his bubble both give the next line
  document.getElementById("homeBuddy").addEventListener("click", onChalkyTap);
  document.getElementById("homeBubble").addEventListener("click", onChalkyTap);

  // ---------- screens + hash routing ----------
  // Routes: #home · #levels/<topic> · #play/<level id> · #daily · #review · #tricky/<kind>
  const LEVELS_BY_ID = Object.fromEntries(LEVELS.map(l => [l.id, l]));
  const SCREENS = { home: $screenHome, levels: $screenLevels, play: $screenPlay };

  function showScreen(name) {
    Object.entries(SCREENS).forEach(([key, el]) => { el.hidden = key !== name; });
    window.scrollTo(0, 0);
  }

  function playHash(level) { return `#play/${level.id}`; }

  function go(hash) {
    if (location.hash === hash) onRoute();
    else location.hash = hash; // triggers hashchange → onRoute
  }

  function leaveDaily() {
    if (!inDailyMode) return;
    inDailyMode = false;
    if (regularLevelState) ({ stepIndex, hintUsedThisLevel, wrongThisLevel } = regularLevelState);
    regularLevelState = null;
  }

  function leaveReview() {
    if (!inReviewMode) return;
    inReviewMode = false;
    review = null;
    if (regularLevelState) ({ stepIndex, hintUsedThisLevel, wrongThisLevel } = regularLevelState);
    regularLevelState = null;
  }

  function openLevel(level) {
    leaveDaily();
    leaveReview();
    const sameLevel = currentLevel() === level; // resume mid-level if it's the one you left
    activeDifficulty = level.difficulty;
    setActiveTopic(level.topic, false);
    levelIndex = activeLevels.indexOf(level);
    if (!sameLevel || stepIndex >= level.steps.length) stepIndex = 0;
    saveProgress();
    render();
  }

  function onRoute() {
    cancelReplay();
    hideCompleteOverlay();
    if (!$tipOverlay.hidden) closeTierTip(false);   // left before reading it, so it shows again next time
    closeFormulaSheet(false);
    if ($tutorialOverlay.classList.contains("show") && !$tutorialOverlay.classList.contains("hiding")) closeTutorial(false);
    const [screen, arg] = location.hash.replace(/^#/, "").split("/");
    if (screen === "play" && LEVELS_BY_ID[arg]) {
      const level = LEVELS_BY_ID[arg];
      if (!isUnlocked(level)) {               // locked via a typed/bookmarked URL → its level select
        history.replaceState(null, "", `#levels/${level.topic}`);
        return onRoute();
      }
      openLevel(level);
      setBackLabel("backLevels", "Levels");
      showScreen("play");
      maybeShowTierTip(level);
    } else if (screen === "levels" && LEVELS_BY_TOPIC_AND_DIFFICULTY[arg]) {
      leaveDaily();
      leaveReview();
      renderLevelSelect(arg);
      showScreen("levels");
      // First visit to a topic → its tutorial. Topics already played (from before tutorials existed) are skipped.
      if (!tutorialsSeen.has(arg) && !topicStats(arg).cleared) openTutorial(arg, true);
    } else if (screen === "daily" && !isDailyCompletedToday()) {
      leaveReview();
      if (!inDailyMode) regularLevelState = { stepIndex, hintUsedThisLevel, wrongThisLevel };
      inDailyMode = true;
      dailyLevel = getTodaysLevel();
      stepIndex = 0;
      render();
      setBackLabel("backHome", "Home");
      showScreen("play");
    } else if (screen === "review" && clearedLevels().length >= REVIEW_UNLOCK) {
      leaveDaily();
      if (!inReviewMode) regularLevelState = { stepIndex, hintUsedThisLevel, wrongThisLevel };
      inReviewMode = true;
      startReview();   // always a fresh session, including "Play again" and a page refresh
      setBackLabel("backHome", "Home");
      showScreen("play");
    } else if (screen === "tricky" && practicePool(arg).length >= PRACTICE_MIN) {
      leaveDaily();
      if (!inReviewMode) regularLevelState = { stepIndex, hintUsedThisLevel, wrongThisLevel };
      inReviewMode = true;
      startPractice(arg);   // always a fresh session, including "Practise again" and a page refresh
      setBackLabel("backHome", "Home");
      showScreen("play");
    } else {
      if (location.hash !== "#home") history.replaceState(null, "", "#home");
      leaveDaily();
      leaveReview();
      updateDailyCard();
      updateReviewCard();
      updateHomeCards();
      updateTrickyCard();   // before homeSay(), so Chalky can announce it the first time
      showScreen("home");
      homeSay(false);
    }
  }

  window.addEventListener("hashchange", onRoute);

  $topicCards.addEventListener("click", (e) => {
    const card = e.target.closest(".topic-card");
    if (!card) return;
    go(`#levels/${card.dataset.topic}`);
  });

  $backBtn.addEventListener("click", () => go(inDailyMode || inReviewMode ? "#home" : `#levels/${activeTopic}`));

  // ---------- intro: Chalky introduces himself, then the game ----------
  // Tap-through steps. On each one Chalky "says" his line, then a small visual appears.
  // Next works any time (even mid-sentence); Skip closes it; the top-bar ❔ replays it.
  const INTRO_SEEN_KEY = "lll_algebra_intro_seen";
  const INTRO_STEPS = ["introWelcome", "introAboutMe", "introHowIHelp", "introTopics", "introStars", "introModes", "introReady"];
  const $introFade1 = document.getElementById("introFade1");
  const $introFade2 = document.getElementById("introFade2");
  const $introSpeech = document.getElementById("introSpeech");
  const $introVisual = document.getElementById("introVisual");
  const $introDots = document.getElementById("introDots");
  const $introNextBtn = document.getElementById("introNextBtn");
  const $introSkipBtn = document.getElementById("introSkipBtn");
  const introBuddy = makeBuddy(document.getElementById("introBuddy"), null);
  let introStep = 0;
  let introTimers = [];

  function introLater(fn, ms) { introTimers.push(setTimeout(fn, ms)); }
  function clearIntroTimers() { introTimers.forEach(clearTimeout); introTimers = []; }

  // The small picture under Chalky's line for each step
  function introVisualHtml(key) {
    const t = k => LLL_I18N.t(k) || "";
    if (key === "introAboutMe") {
      // A little chalkboard he's written on, with his favourite letter picked out
      return `<div class="intro-chalkboard" aria-hidden="true">
        <span>2x + 3 = 11</span>
        <span><span class="chalk-x">x</span> = 4</span>
      </div>`;
    }
    if (key === "introHowIHelp") {
      // His three faces, so players recognise his reactions in a level
      const faces = [["happy", "introFaceRight"], ["oops", "introFaceOops"], ["thinking", "introFaceHint"]];
      return `<div class="intro-faces">${faces.map(([face, label]) => `
        <div class="intro-face">
          <span class="intro-face-sprite" aria-hidden="true">${BUDDY_SVG[face]}</span>
          <span class="intro-face-label">${t(label)}</span>
        </div>`).join("")}</div>`;
    }
    if (key === "introTopics") {
      return `<div class="intro-topic-list">${Object.keys(TOPIC_LABEL_KEYS).map(tp => `
        <div class="intro-topic">
          <span class="topic-card-sample">${TOPIC_SAMPLES[tp].split("\n")[0].replace(/\^(-?\d+)/g, '<span class="pow">$1</span>')}</span>
          <span class="intro-topic-name">${t(TOPIC_LABEL_KEYS[tp])}</span>
        </div>`).join("")}</div>`;
    }
    if (key === "introStars") return `<div class="intro-big-stars"><span>★</span><span>★</span><span>★</span></div>`;
    if (key === "introModes") {
      return `<div class="intro-mode-list">
        <div class="intro-mode"><span aria-hidden="true">📅</span>${t("dailyTitle")}</div>
        <div class="intro-mode"><span aria-hidden="true">🔀</span>${t("reviewTitle")}</div>
      </div>`;
    }
    if (key === "introReady") return `<div class="intro-big-icon" aria-hidden="true">🏆</div>`;
    // Welcome: a mini pixel card with the unknown he's about to help you find
    return `<div class="equation-card pixel-card intro-welcome-card"><p class="equation">x = ?</p></div>`;
  }

  function showIntroStep(i) {
    clearIntroTimers();
    introStep = i;
    const key = INTRO_STEPS[i];
    const last = i === INTRO_STEPS.length - 1;
    const t = k => LLL_I18N.t(k) || "";

    $introDots.innerHTML = INTRO_STEPS.map((_, n) => `<span class="step-dot${n <= i ? " filled" : ""}"></span>`).join("");
    $introNextBtn.textContent = t(last ? "introStartBtn" : "introNextBtn");
    $introSkipBtn.textContent = t("tutSkipBtn");
    $introSkipBtn.hidden = last;
    $introSpeech.textContent = "";
    $introVisual.classList.remove("reveal");
    $introVisual.innerHTML = introVisualHtml(key);

    // Arms up to say hi (first step), a hop for the rest, then he talks and the visual appears
    introBuddy.react(i === 0 ? "celebrating" : "happy", { ms: 700 });
    introLater(() => {
      introBuddy.talk($introSpeech, t(key), () => {
        $introVisual.classList.add("reveal");
        if (last) introBuddy.react("celebrating", { stay: true });
      });
    }, 600);
  }

  function openIntro() {
    clearIntroTimers();
    $introOverlay.classList.remove("hiding");
    $introOverlay.classList.add("show");
    [$introFade1, $introFade2].forEach(el => el.classList.remove("reveal"));
    introLater(() => $introFade1.classList.add("reveal"), 150);
    introLater(() => { $introFade2.classList.add("reveal"); showIntroStep(0); }, 450);
  }

  function closeIntro() {
    clearIntroTimers();
    introBuddy.stop();
    $introOverlay.classList.add("hiding");
    setTimeout(() => $introOverlay.classList.remove("show"), 400);
    try { localStorage.setItem(INTRO_SEEN_KEY, "1"); } catch (e) { /* fail silently */ }
  }

  $introNextBtn.addEventListener("click", () => {
    if (introStep < INTRO_STEPS.length - 1) showIntroStep(introStep + 1);
    else closeIntro();
  });
  $introSkipBtn.addEventListener("click", closeIntro);
  $howtoBtn.addEventListener("click", openIntro);

  // ---------- topic tutorials ----------
  // Shown once per topic on first visit, reopenable from the ❔ on the level-select screen.
  // Chalky explains the key idea, then a demo level plays step by step using the real game pieces.
  const TUTORIAL_SEEN_KEY = "lll_algebra_tutorials_seen";
  const TUT_TIP_COUNT = { equation: 2, inequality: 2, brackets: 2, quadratic: 3, system: 2, fraction: 2, subject: 2, expression: 2, indices: 2, roots: 2, line: 2 };
  const TUT_STEP_MS = 2600;   // time per demo step

  // Demo level per topic: normally the first Easy level, except where that level skips the
  // topic's key move. Inequalities demos a sign flip; Quadratics demos factorising (Easy is pre-factored).
  function tutorialDemoLevel(topic) {
    if (topic === "inequality") {
      const flipLevel = LEVELS.find(l => l.topic === topic && l.steps.some(s => s.flip));
      if (flipLevel) return flipLevel;
    }
    if (topic === "quadratic" && levelsFor(topic, "medium").length) return levelsFor(topic, "medium")[0];
    // Formulas: a two-step level, so the demo shows why (y - 1) stays in brackets
    // Expressions: a two-step level, so the demo collects the letters, then the numbers
    // Indices: a two-step level (Easy 9, x^2 × x^3 × x^4), so the demo uses the multiply rule twice
    // Completing the square: a two-step level (Easy 3, (x + 3)² = 16), so the demo shows √ with ±, then solving
    if (topic === "subject" || topic === "expression" || topic === "indices" || topic === "roots") {
      const twoStep = levelsFor(topic, "easy").find(l => l.steps.length === 2);
      if (twoStep) return twoStep;
    }
    return levelsFor(topic, "easy")[0];
  }

  const $tutorialOverlay = document.getElementById("tutorialOverlay");
  const $tutFade1 = document.getElementById("tutFade1");
  const $tutFade2 = document.getElementById("tutFade2");
  const $tutFade3 = document.getElementById("tutFade3");
  const $tutSample = document.getElementById("tutSample");
  const $tutTitle = document.getElementById("tutTitle");
  const $tutBody = document.getElementById("tutBody");
  const $tutStepDots = document.getElementById("tutStepDots");
  const $tutEquationCard = document.getElementById("tutEquationCard");
  const $tutEquation = document.getElementById("tutEquation");
  const $tutPrompt = document.getElementById("tutPrompt");
  const $tutChoices = document.getElementById("tutChoices");
  const $tutTips = document.getElementById("tutTips");
  const $tutStartBtn = document.getElementById("tutStartBtn");
  const $tutSkipBtn = document.getElementById("tutSkipBtn");
  const $levelsHelpBtn = document.getElementById("levelsHelpBtn");
  const tutBuddy = makeBuddy(document.getElementById("tutBuddy"), null);

  let tutorialsSeen = new Set();
  try { tutorialsSeen = new Set(JSON.parse(localStorage.getItem(TUTORIAL_SEEN_KEY) || "[]")); } catch (e) { /* fail silently */ }
  let tutTopic = null;
  let tutAuto = false;   // true = opened on first visit, so Start goes straight into level 1
  let tutTimers = [];

  function tutLater(fn, ms) { tutTimers.push(setTimeout(fn, ms)); }
  function clearTutTimers() { tutTimers.forEach(clearTimeout); tutTimers = []; }

  function markTutorialSeen(topic) {
    tutorialsSeen.add(topic);
    try { localStorage.setItem(TUTORIAL_SEEN_KEY, JSON.stringify([...tutorialsSeen])); } catch (e) { /* fail silently */ }
  }

  // Same pixel ≤ / ≥ handling as the game's equation card, for any element.
  function setPixelEq(el, text) {
    setEqLen(el, text);
    el.textContent = "";
    for (const ch of eqUnits(text)) {
      if (ch.length > 1 && ch[0] === "^") {
        el.appendChild(makePow(ch.slice(1), "-"));
      } else if (ch.length > 1 && "√{_".includes(ch[0])) {   // a whole root, stacked fraction or subscript
        appendWithPowers(el, ch, "-");
      } else if (INEQ_SIGN.test(ch)) {
        const s = document.createElement("span");
        s.className = "ineq-sign" + (PIXEL_INEQ[ch] ? " pixel-ineq" : "");
        s.textContent = PIXEL_INEQ[ch] || ch;
        el.appendChild(s);
      } else {
        el.appendChild(document.createTextNode(ch));
      }
    }
  }

  function fillTutorialText(topic) {
    const t = k => LLL_I18N.t(k) || "";
    const base = TOPIC_LABEL_KEYS[topic];
    $tutSample.textContent = "";
    appendWithPowers($tutSample, TOPIC_SAMPLES[topic], "-");
    $tutTitle.textContent = t(base);
    setMathText($tutBody, t(`${base}TutBody`));
    $tutTips.innerHTML = "";
    for (let i = 1; i <= TUT_TIP_COUNT[topic]; i++) {
      const li = document.createElement("li");
      li.className = "intro-tip";
      li.innerHTML = '<span class="intro-tip-icon" aria-hidden="true">💡</span><span class="intro-tip-text"></span>';
      setMathText(li.lastChild, t(`${base}TutTip${i}`));
      $tutTips.appendChild(li);
    }
    $tutStartBtn.textContent = t(tutAuto ? "tutStartBtn" : "tutGotItBtn");
    $tutSkipBtn.textContent = t("tutSkipBtn");
  }

  // Plays every step of the level: show a correct + a wrong choice, tap the correct one,
  // update the equation. Returns how long the whole demo takes (ms).
  function runTutorialDemo(level) {
    const steps = level.steps;
    $tutStepDots.innerHTML = steps.map(() => '<span class="step-dot"></span>').join("");
    $tutEquationCard.classList.remove("solved");
    $tutEquationCard.classList.toggle("system-card", level.topic === "system" || steps.some(s => s.result.includes("\n")));
    $tutEquation.classList.remove("updating");
    setPixelEq($tutEquation, level.equation);
    $tutChoices.innerHTML = "";
    $tutPrompt.hidden = true;

    steps.forEach((step, i) => {
      tutLater(() => {
        const prompt = choicePrompt(level, step);
        $tutPrompt.hidden = !prompt;
        $tutPrompt.textContent = prompt;

        const wrong = Array.isArray(step.wrong)
          ? { action: step.action, value: step.wrong[0] }
          : makeDistractors(step)[0];
        $tutChoices.innerHTML = "";
        const [, correctBtn] = [wrong, { action: step.action, value: step.value }].map(c => {
          const b = document.createElement("button");
          b.className = "choice-btn";
          b.tabIndex = -1;                     // demo only, not interactive
          b.setAttribute("aria-hidden", "true");
          const label = actionLabel(c.action, c.value);
          if (isLongChoice(label)) b.classList.add("long");
          appendWithPowers(b, label);
          $tutChoices.appendChild(b);
          return b;
        });

        tutLater(() => correctBtn.classList.add("intro-demo-tap"), 1000);
        tutLater(() => {
          correctBtn.classList.remove("intro-demo-tap");
          correctBtn.classList.add("correct");
          $tutEquation.classList.add("updating");
          // Hop on each correct move; arms up on the last one (stays until the tips appear)
          const last = i === steps.length - 1;
          tutBuddy.react(last ? "celebrating" : "happy", { ms: 900, stay: last });
        }, 1500);
        tutLater(() => {
          setPixelEq($tutEquation, step.result);
          $tutEquation.classList.remove("updating");
          if (step.flip) {   // same turn-around + accent colour as in the game
            const sign = $tutEquation.querySelector(".ineq-sign");
            if (sign) sign.classList.add("flip-cue");
          }
          const dot = $tutStepDots.children[i];
          dot.classList.add("filled");
          if (i === steps.length - 1) {
            dot.classList.add("solved");
            $tutEquationCard.classList.add("solved");
          }
        }, 1750);
      }, i * TUT_STEP_MS);
    });
    return steps.length * TUT_STEP_MS;
  }

  function openTutorial(topic, auto) {
    clearTutTimers();
    tutTopic = topic;
    tutAuto = auto;
    fillTutorialText(topic);
    $tutBody.textContent = "";   // typed out by the buddy below
    tutBuddy.idle();
    $tutorialOverlay.classList.remove("hiding");
    $tutorialOverlay.classList.add("show");
    [$tutFade1, $tutFade2, $tutFade3].forEach(el => el.classList.remove("reveal"));
    // 1) the buddy explains the key idea  2) the demo plays  3) the tips appear
    tutLater(() => {
      $tutFade1.classList.add("reveal");
      tutBuddy.talk($tutBody, LLL_I18N.t(`${TOPIC_LABEL_KEYS[topic]}TutBody`) || "", () => {
        tutLater(() => {
          $tutFade2.classList.add("reveal");
          const demoMs = runTutorialDemo(tutorialDemoLevel(topic));
          tutLater(() => { $tutFade3.classList.add("reveal"); tutBuddy.idle(); }, demoMs);
        }, 300);
      });
    }, 400);
  }

  function closeTutorial(startPlaying) {
    clearTutTimers();
    tutBuddy.stop();
    if (tutTopic) markTutorialSeen(tutTopic);
    $tutorialOverlay.classList.add("hiding");
    setTimeout(() => $tutorialOverlay.classList.remove("show", "hiding"), 400);
    if (startPlaying && tutTopic) go(playHash(levelsFor(tutTopic, "easy")[0]));
  }

  $tutStartBtn.addEventListener("click", () => closeTutorial(tutAuto));
  $tutSkipBtn.addEventListener("click", () => closeTutorial(false));
  $levelsHelpBtn.addEventListener("click", () => {
    const topic = location.hash.split("/")[1];
    if (LEVELS_BY_TOPIC_AND_DIFFICULTY[topic]) openTutorial(topic, false);
  });

  // ---------- tier tips ----------
  // One-time tips from Chalky for tiers that introduce a new move (text + demo in levels.js).
  // Shown the first time the player opens any level in that tier, before they play.
  // Marked seen only when dismissed, so leaving before reading it shows it again next time.
  // Not shown in Today's Challenge or Mixed Review.
  const TIER_TIPS_SEEN_KEY = "lll_algebra_tier_tips_seen";
  const $tipOverlay = document.getElementById("tipOverlay");
  const $tipTag = document.getElementById("tipTag");
  const $tipText = document.getElementById("tipText");
  const $tipDemo = document.getElementById("tipDemo");
  const $tipDemoLabel = document.getElementById("tipDemoLabel");
  const $tipFromCard = document.getElementById("tipFromCard");
  const $tipFrom = document.getElementById("tipFrom");
  const $tipMove = document.getElementById("tipMove");
  const $tipTo = document.getElementById("tipTo");
  const $tipPicture = document.getElementById("tipPicture");

  // Small diagrams a tier tip can show above its demo (`picture` in TIER_TIPS). Colours come from brand.css.
  const TIP_PICTURES = {
    // x² + 6x as tiles: an x-by-x square and two 3-by-x strips, with the 3-by-3 corner (the 9) missing.
    // Underneath: the general rule, then (x + 3)² written out, each term coloured like its tile.
    squareTiles: `<svg viewBox="0 0 230 222" role="img" aria-label="x² + 6x as tiles: a square, two strips of 3x, and a missing 3 × 3 corner worth 9. (x ± n)² = x² ± 2n·x + n², so (x + 3)² = x² + 3x + 3x + 9 = x² + 6x + 9">
      <text class="tile-edge" x="104" y="9">x</text><text class="tile-edge" x="170" y="9">3</text>
      <text class="tile-edge" x="46" y="63">x</text><text class="tile-edge" x="46" y="129">3</text>
      <rect class="tile tile-sq" x="59" y="18" width="90" height="90"/>
      <rect class="tile tile-strip" x="152" y="18" width="36" height="90"/>
      <rect class="tile tile-strip" x="59" y="111" width="90" height="36"/>
      <rect class="tile tile-gap" x="152" y="111" width="36" height="36"/>
      <text class="tile-label" x="104" y="63">x²</text>
      <text class="tile-label" x="170" y="63">3x</text>
      <text class="tile-label" x="104" y="129">3x</text>
      <text class="tile-label tile-gap-label" x="170" y="129">+9</text>
      <text class="tile-math tile-rule" x="115" y="170">(x ± n)² = x² ± 2n·x + n²</text>
      <text class="tile-math" x="115" y="192">(x + 3)² = <tspan class="tile-t-sq">x²</tspan> + <tspan class="tile-t-strip">3x</tspan> + <tspan class="tile-t-strip">3x</tspan> + <tspan class="tile-t-gap">9</tspan></text>
      <text class="tile-math" x="115" y="214">= x² + 6x + <tspan class="tile-t-gap">9</tspan></text>
    </svg>`
  };
  const $tipOkBtn = document.getElementById("tipOkBtn");
  const tipBuddy = makeBuddy(document.getElementById("tipBuddy"), null);

  let tierTipsSeen = new Set();
  try { tierTipsSeen = new Set(JSON.parse(localStorage.getItem(TIER_TIPS_SEEN_KEY) || "[]")); } catch (e) { /* fail silently */ }
  let tipKey = null;     // e.g. "equation_hard" while the overlay is open
  let tipTimer = null;

  // Everything except the tip text, which Chalky types out
  function fillTierTip() {
    const tip = TIER_TIPS[tipKey];
    const lang = currentLang();
    const t = k => LLL_I18N.t(k) || "";
    const tier = tipKey.split("_")[1];
    $tipTag.textContent = t("tipTag").split("{tier}").join(t(TIER_LABEL_KEYS[tier]));
    $tipDemoLabel.textContent = t("tipDemoLabel");
    $tipPicture.innerHTML = TIP_PICTURES[tip.picture] || "";
    $tipPicture.hidden = !TIP_PICTURES[tip.picture];
    setPixelEq($tipFrom, tip.demo.from);
    $tipFromCard.classList.toggle("system-card", tip.demo.from.includes("\n"));
    setMathText($tipMove, (tip.demo.move[lang] || tip.demo.move.en).replace(/-(?=\d)/g, "−"));
    setPixelEq($tipTo, tip.demo.to);
    $tipOkBtn.textContent = t("tipOkBtn");
  }

  // typed = Chalky types it, then the demo fades in. Otherwise (language switch) it all shows at once.
  function showTipText(typed) {
    const tip = TIER_TIPS[tipKey];
    const text = tip.text[currentLang()] || tip.text.en;
    if (typed) {
      tipBuddy.talk($tipText, text, () => $tipDemo.classList.add("reveal"));
    } else {
      tipBuddy.idle();
      setMathText($tipText, text);
      $tipDemo.classList.add("reveal");
    }
  }

  function maybeShowTierTip(level) {
    const key = `${level.topic}_${level.difficulty}`;
    if (!TIER_TIPS[key] || tierTipsSeen.has(key)) return;
    tipKey = key;
    fillTierTip();
    $tipText.textContent = "";
    $tipDemo.classList.remove("reveal");
    $tipOverlay.hidden = false;
    $tipOkBtn.focus({ preventScroll: true });
    tipBuddy.react("happy", { ms: 600 });   // a hop to say "new thing!", then he talks
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => showTipText(true), 500);
  }

  function closeTierTip(markSeen = true) {
    clearTimeout(tipTimer);
    tipBuddy.stop();
    $tipOverlay.hidden = true;
    if (markSeen && tipKey) {
      tierTipsSeen.add(tipKey);
      try { localStorage.setItem(TIER_TIPS_SEEN_KEY, JSON.stringify([...tierTipsSeen])); } catch (e) { /* fail silently */ }
    }
    tipKey = null;
  }

  $tipOkBtn.addEventListener("click", () => closeTierTip());
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$tipOverlay.hidden) closeTierTip();
  });

  // ---------- formula sheet ----------
  // 📐 on level select (next to ❔) and next to Hint during play. Free: it's a reference, not an answer.
  // Shows the current level's topic (formulas.js), so Mixed Review, Tricky spots and Today's Challenge
  // follow each question. Topics with no entries get no button. Hidden during "Show me".
  // Level select: Chalky stands beside the sheet, taking turns reading and writing an x.
  // Play: no second Chalky; the play-screen one puts his glasses on and reads until it closes.
  const $formulaTitle = document.getElementById("formulaTitle");
  const $formulaList = document.getElementById("formulaList");
  const $formulaOkBtn = document.getElementById("formulaOkBtn");
  let formulaTopic = null;
  let formulaInPlay = false;
  let formulaReadNext = true;
  const formulaBuddy = makeBuddy(document.getElementById("formulaBuddy"), null, {
    idles: {
      delay: () => 2500 + Math.random() * 2000,
      pick: () => {
        const anim = formulaReadNext ? CHALKY_IDLES.reading : CHALKY_IDLES.writing;
        formulaReadNext = !formulaReadNext;
        return anim;
      },
      canPlay: () => !$formulaOverlay.hidden && !document.hidden
    }
  });

  function updateFormulaBtn(level = currentLevel()) {
    $formulaBtn.hidden = replaying || !hasFormulas(level.topic);
  }

  // Narrow screens: a line may only break after " = " or " → ", so each side stays whole
  // ("(x + a)(x + b) =" / "x² + (a + b)x + ab", never "(a +" / "b)x").
  function setFormulaMath(el, text) {
    el.textContent = "";
    const parts = text.split(/(?<= [=→]) /);
    parts.forEach((part, i) => {
      const span = document.createElement("span");
      span.className = "nowrap";
      setMathText(span, part);
      el.append(span);
      if (i < parts.length - 1) el.append(" ");
    });
  }

  function fillFormulaSheet() {
    const t = k => LLL_I18N.t(k) || "";
    const lang = currentLang();
    $formulaTitle.textContent = t("formulaSheetTitle").split("{topic}").join(t(TOPIC_LABEL_KEYS[formulaTopic]) || formulaTopic);
    $formulaList.innerHTML = "";
    TOPIC_FORMULAS[formulaTopic].forEach(entry => {
      const block = document.createElement("div");
      block.className = "formula-entry";
      const name = document.createElement("p");
      name.className = entry.rule ? "formula-name formula-rule" : "formula-name";
      name.textContent = entry.rule ? t("formulaSheetRule") : formulaText(entry.name, lang);
      const math = document.createElement("p");
      math.className = "formula-math";
      setFormulaMath(math, formulaText(entry.formula, lang));
      block.append(name, math);
      if (entry.example || entry.note) {
        const ex = document.createElement("p");
        ex.className = "formula-example";
        setFormulaMath(ex, entry.example
          ? t("formulaSheetExample") + formulaText(entry.example, lang)
          : formulaText(entry.note, lang));
        block.append(ex);
      }
      $formulaList.append(block);
    });
    $formulaOkBtn.textContent = t("formulaSheetOk");
  }

  function openFormulaSheet(topic, inPlay) {
    if (!hasFormulas(topic)) return;
    formulaTopic = topic;
    formulaInPlay = inPlay;
    fillFormulaSheet();
    $formulaOverlay.classList.toggle("in-play", inPlay);
    $formulaOverlay.hidden = false;
    $formulaOkBtn.focus({ preventScroll: true });
    if (inPlay) playBuddy.react("idle", { look: "reading", stay: true });
    else if (REDUCED_MOTION) formulaBuddy.react("idle", { look: "reading", stay: true });   // still pose, no idles
    else { formulaReadNext = true; formulaBuddy.idle(); }
  }

  // restoreFocus: back to the 📐 that opened it (not when the sheet closes because the screen changed)
  function closeFormulaSheet(restoreFocus = true) {
    if ($formulaOverlay.hidden) return;
    $formulaOverlay.hidden = true;
    formulaBuddy.stop();
    if (formulaInPlay) playBuddy.idle();
    if (restoreFocus) (formulaInPlay ? $formulaBtn : $levelsFormulaBtn).focus({ preventScroll: true });
    formulaTopic = null;
  }

  $levelsFormulaBtn.addEventListener("click", () => openFormulaSheet(location.hash.split("/")[1], false));
  $formulaBtn.addEventListener("click", () => openFormulaSheet(currentLevel().topic, true));
  $formulaOkBtn.addEventListener("click", () => closeFormulaSheet());
  document.getElementById("formulaCloseBtn").addEventListener("click", () => closeFormulaSheet());
  document.getElementById("formulaBackdrop").addEventListener("click", () => closeFormulaSheet());
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$formulaOverlay.hidden) closeFormulaSheet();
  });

  initFloatingSymbols();
  setActiveTopic(activeTopic, false);
  loadProgress();
  // Backfill: existing progress unlocks topic / Mixed Review achievements quietly, without a toast flood.
  // (Clean Sweep can't be backfilled — flawless sessions weren't tracked before.)
  checkTopicAchievements({ silent: true });
  if (reviewBest > 0) unlockAchievement("review_first", { silent: true });
  updateTrophyDot();
  updateDailyCard();
  onRoute();

  let hasSeenIntro = false;
  try { hasSeenIntro = localStorage.getItem(INTRO_SEEN_KEY) === "1"; } catch (e) { /* fail silently */ }
  if (!hasSeenIntro) openIntro();

  const MIN_DISPLAY_MS = 400;
  const elapsed = performance.now() - loadStart;
  const remaining = Math.max(0, MIN_DISPLAY_MS - elapsed);

  setTimeout(() => {
    const $loadingOverlay = document.getElementById("loadingOverlay");
    if ($loadingOverlay) {
      $loadingOverlay.classList.add("hiding");
      setTimeout(() => $loadingOverlay.remove(), 250);
    }
  }, remaining);
</script>
</body>
</html>
