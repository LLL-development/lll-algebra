<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f3ee">
<link rel="icon" href="core/favicon.svg" type="image/svg+xml">
<title>LLL Algebra</title>
<script src="core/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/brand.css">
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-dots">
    <span></span><span></span><span></span>
  </div>
</div>

<div id="floatingSymbolsLayer" class="floating-symbols-layer"></div>

<div id="grandConfettiLayer" class="grand-confetti-layer"></div>

<!-- Level-complete overlay -->
<div class="complete-overlay" id="completeOverlay" hidden>
  <div class="complete-backdrop"></div>
  <div class="complete-card pixel-card" role="dialog" aria-modal="true" aria-labelledby="completeKicker">
    <p class="complete-kicker" id="completeKicker"></p>
    <p class="complete-sub" id="completeSub"></p>
    <div class="complete-stars" id="completeStars"></div>
    <div class="complete-graph" id="completeGraph" hidden>
      <svg class="complete-graph-svg" id="completeGraphSvg" viewBox="0 0 280 280" role="img"></svg>
      <div class="complete-graph-legend" id="completeGraphLegend"></div>
    </div>
    <div class="complete-numberline" id="completeNumberLine" hidden>
      <svg class="complete-numberline-svg" id="completeNumberLineSvg" viewBox="0 0 280 50" role="img"></svg>
      <p class="complete-numberline-label" id="completeNumberLineLabel"></p>
    </div>
    <div class="complete-buddy-row">
      <div class="buddy-sprite complete-buddy" id="completeBuddy" aria-hidden="true"></div>
      <p class="buddy-bubble complete-bubble" id="completeBubble" aria-live="polite"></p>
    </div>
    <p class="complete-best" id="completeBest" hidden></p>
    <p class="complete-points" id="completePoints"></p>
    <p class="complete-bonus" id="completeBonus" hidden></p>
    <div class="complete-review" id="completeReview" hidden></div>
    <p class="complete-explanation" id="completeExplanation" hidden></p>
    <div class="complete-actions">
      <button class="complete-btn primary" id="completePrimaryBtn"></button>
      <div class="complete-secondary">
        <button class="complete-btn secondary" id="completeRetryBtn"></button>
        <button class="complete-btn secondary" id="completeLevelsBtn"></button>
      </div>
      <button class="complete-btn secondary complete-watch-btn" id="completeWatchBtn" hidden></button>
    </div>
  </div>
</div>

<!-- Tier tip overlay: one-time tip from Chalky the first time a tier with a new move is opened -->
<div class="tip-overlay" id="tipOverlay" hidden>
  <div class="tip-backdrop"></div>
  <div class="tip-card pixel-card" role="dialog" aria-modal="true" aria-labelledby="tipTag">
    <div class="tip-head">
      <div class="buddy-sprite tip-buddy" id="tipBuddy" aria-hidden="true"></div>
      <div class="tip-head-text">
        <span class="tip-tag" id="tipTag"></span>
        <p class="tip-text" id="tipText" aria-live="polite"></p>
      </div>
    </div>
    <div class="tip-demo" id="tipDemo">
      <p class="tip-demo-label" id="tipDemoLabel"></p>
      <div class="tip-picture" id="tipPicture" hidden></div>
      <div class="equation-card pixel-card tip-demo-card" id="tipFromCard"><p class="equation tip-demo-eq" id="tipFrom"></p></div>
      <p class="tip-demo-move" id="tipMove"></p>
      <div class="equation-card pixel-card tip-demo-card"><p class="equation tip-demo-eq" id="tipTo"></p></div>
    </div>
    <button class="complete-btn primary tip-ok-btn" id="tipOkBtn"></button>
  </div>
</div>

<!-- Formula sheet: 📐 on level select and next to Hint. Entries in formulas.js -->
<div class="formula-overlay" id="formulaOverlay" hidden>
  <div class="formula-backdrop" id="formulaBackdrop"></div>
  <div class="formula-wrap">
    <div class="buddy-sprite formula-buddy" id="formulaBuddy" aria-hidden="true"></div>
    <div class="formula-card pixel-card" role="dialog" aria-modal="true" aria-labelledby="formulaTitle">
      <div class="formula-head">
        <h2 class="formula-title" id="formulaTitle"></h2>
        <button class="formula-close-btn" id="formulaCloseBtn" aria-label="Close">✕</button>
      </div>
      <div class="formula-list" id="formulaList"></div>
      <button class="complete-btn primary formula-ok-btn" id="formulaOkBtn"></button>
    </div>
  </div>
</div>

<div id="achievementToast" class="achievement-toast">
  <span class="achievement-toast-icon">🏆</span>
  <span class="achievement-toast-text" id="achievementToastText"></span>
</div>

<div id="achievementsModal" class="achievements-modal">
  <div class="achievements-modal-backdrop" id="achievementsBackdrop"></div>
  <div class="achievements-modal-card">
    <div class="achievements-modal-header">
      <h2><span data-i18n="achievementsTitle">Achievements</span><span class="achievements-total" id="achievementsTotal"></span></h2>
      <button class="achievements-close-btn" id="achievementsCloseBtn" aria-label="Close">✕</button>
    </div>
    <div class="achievements-list" id="achievementsList"></div>
  </div>
</div>

<div id="tutorialOverlay" class="intro-overlay">
  <div class="intro-content">
    <div class="intro-fade" id="tutFade1">
      <span class="topic-card-sample" id="tutSample"></span>
      <h2 id="tutTitle"></h2>
      <div class="tut-narrator">
        <div class="buddy-sprite tut-buddy" id="tutBuddy" aria-hidden="true"></div>
        <p class="tut-speech" id="tutBody"></p>
      </div>
    </div>

    <div class="intro-fade" id="tutFade2">
      <div class="step-progress intro-demo-dots" id="tutStepDots"></div>
      <div class="equation-card pixel-card intro-demo-card" id="tutEquationCard">
        <p class="equation intro-demo-eq" id="tutEquation"></p>
      </div>
      <p class="expand-prompt" id="tutPrompt" hidden></p>
      <div class="intro-demo-choices" id="tutChoices"></div>
    </div>

    <div class="intro-fade" id="tutFade3">
      <ul class="intro-tips" id="tutTips"></ul>
      <button class="intro-start-btn" id="tutStartBtn"></button>
    </div>

    <button class="tut-skip-btn" id="tutSkipBtn"></button>
  </div>
</div>

<div id="introOverlay" class="intro-overlay">
  <div class="intro-content">
    <div class="intro-fade" id="introFade1">
      <span class="brand-logo"><img src="core/logo.svg" alt="LLL"></span>
      <p class="intro-brand-title" data-i18n="gameTitle">LLL Algebra</p>
    </div>

    <div class="intro-fade" id="introFade2">
      <div class="tut-narrator intro-narrator">
        <div class="buddy-sprite tut-buddy" id="introBuddy" aria-hidden="true"></div>
        <p class="tut-speech" id="introSpeech" aria-live="polite"></p>
      </div>
      <div class="intro-visual" id="introVisual"></div>
      <div class="step-progress" id="introDots"></div>
      <button class="intro-start-btn" id="introNextBtn"></button>
    </div>

    <button class="tut-skip-btn" id="introSkipBtn"></button>
  </div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-logo"><img src="core/logo.svg" alt="LLL"></span>
    <span class="brand-name" data-i18n="gameTitle">LLL Algebra</span>
  </div>
  <div class="topbar-controls">
    <button class="howto-btn" id="howtoBtn" aria-label="How to play">❔</button>
    <button class="trophy-btn" id="trophyBtn" aria-label="Achievements">🏆<span class="trophy-dot" id="trophyDot" hidden></span></button>
    <button class="howto-btn sound-btn" id="soundBtn" aria-label="Mute sound">🔊</button>
    <div id="langHost"></div>
    <div id="themeHost"></div>
  </div>
</header>

<main class="stage">


  <!-- ===== Home screen ===== -->
  <section class="screen" id="screenHome" hidden>
    <button class="daily-card" id="dailyCard">
      <span class="daily-card-icon">📅</span>
      <div class="daily-card-text">
        <div class="daily-card-title" data-i18n="dailyTitle">Today's Challenge</div>
        <div class="daily-card-status" id="dailyCardStatus"></div>
      </div>
    </button>

    <button class="daily-card review-card" id="reviewCard">
      <span class="daily-card-icon">🔀</span>
      <div class="daily-card-text">
        <div class="daily-card-title" data-i18n="reviewTitle">Mixed Review</div>
        <div class="daily-card-status" id="reviewCardStatus"></div>
      </div>
    </button>

    <div class="tricky-card" id="trickyCard" hidden>
      <div class="tricky-head">
        <span class="daily-card-icon">🎯</span>
        <div class="daily-card-text">
          <div class="daily-card-title" data-i18n="trickyTitle">Your tricky spots</div>
          <div class="daily-card-status" data-i18n="trickySub">Slips that keep coming back</div>
        </div>
      </div>
      <div class="tricky-rows" id="trickyRows"></div>
    </div>

    <div class="home-buddy">
      <div class="home-buddy-wrap">
        <span class="home-tap-hint" id="homeTapHint" data-i18n="homeTapHint" hidden>Tap me!</span>
        <button class="buddy-sprite home-buddy-sprite" id="homeBuddy" aria-label="Chalky"></button>
      </div>
      <p class="buddy-bubble home-bubble show" id="homeBubble" aria-live="polite"></p>
    </div>

    <p class="home-kicker" data-i18n="homeKicker">Choose a topic</p>

    <div class="topic-cards" id="topicCards">
      <button class="topic-card" data-topic="equation">
        <span class="topic-card-sample">x + 5 = 12</span>
        <span class="topic-card-title" data-i18n="topicEquation">Equations</span>
        <span class="topic-card-desc" data-i18n="topicEquationDesc">Find the value of x</span>
        <span class="topic-card-progress" data-progress="equation">
          <span class="topic-card-bar"><span class="topic-card-bar-fill"></span></span>
          <span class="topic-card-count"></span>
        </span>
      </button>
      <button class="topic-card" data-topic="inequality">
        <span class="topic-card-sample">-3x &gt; 12</span>
        <span class="topic-card-title" data-i18n="topicInequality">Inequalities</span>
        <span class="topic-card-desc" data-i18n="topicInequalityDesc">Find the range of x — watch the sign!</span>
        <span class="topic-card-progress" data-progress="inequality">
          <span class="topic-card-bar"><span class="topic-card-bar-fill"></span></span>
          <span class="topic-card-count"></span>
        </span>
      </button>
      <button class="topic-card" data-topic="brackets">
        <span class="topic-card-sample">2(x + 3) = 14</span>
        <span class="topic-card-title" data-i18n="topicBrackets">Brackets</span>
        <span class="topic-card-desc" data-i18n="topicBracketsDesc">Expand, then solve for x</span>
        <span class="topic-card-progress" data-progress="brackets">
          <span class="topic-card-bar"><span class="topic-card-bar-fill"></span></span>
          <span class="topic-card-count"></span>
        </span>
      </button>
      <button class="topic-card" data-topic="quadratic">
        <span class="topic-card-sample">x² + 5x + 6 = 0</span>
        <span class="topic-card-title" data-i18n="topicQuadratic">Quadratics</span>
        <span class="topic-card-desc" data-i18n="topicQuadraticDesc">Factorise, then find both answers</span>
        <span class="topic-card-progress" data-progress="quadratic">
          <span class="topic-card-bar"><span class="topic-card-bar-fill"></span></span>
          <span class="topic-card-count"></span>
        </span>
      </button>
      <button class="topic-card" data-topic="system">
        <span class="topic-card-sample">x + y = 9<br>2x - y = 3</span>
        <span class="topic-card-title" data-i18n="topicSystem">Systems</span>
        <span class="topic-card-desc" data-i18n="topicSystemDesc">Two equations — find x and y</span>
        <span class="topic-card-progress" data-progress="system">
          <span class="topic-card-bar"><span class="topic-card-bar-fill"></span></span>
          <span class="topic-card-count"></span>
        </span>
      </button>
      <button class="topic-card" data-topic="fraction">
        <span class="topic-card-sample">x/2 + x/3 = 5</span>
        <span class="topic-card-title" data-i18n="topicFraction">Fractions</span>
        <span class="topic-card-desc" data-i18n="topicFractionDesc">Clear the fractions, then solve for x</span>
        <span class="topic-card-progress" data-progress="fraction">
          <span class="topic-card-bar"><span class="topic-card-bar-fill"></span></span>
          <span class="topic-card-count"></span>
        </span>
      </button>
      <button class="topic-card" data-topic="subject">
        <span class="topic-card-sample">y = 2x + 1</span>
        <span class="topic-card-title" data-i18n="topicSubject">Formulas</span>
        <span class="topic-card-desc" data-i18n="topicSubjectDesc">Make a different letter the subject</span>
        <span class="topic-card-progress" data-progress="subject">
          <span class="topic-card-bar"><span class="topic-card-bar-fill"></span></span>
          <span class="topic-card-count"></span>
        </span>
      </button>
      <button class="topic-card" data-topic="expression">
        <span class="topic-card-sample">4x + 3 + 2x</span>
        <span class="topic-card-title" data-i18n="topicExpression">Expressions</span>
        <span class="topic-card-desc" data-i18n="topicExpressionDesc">Collect like terms to simplify</span>
        <span class="topic-card-progress" data-progress="expression">
          <span class="topic-card-bar"><span class="topic-card-bar-fill"></span></span>
          <span class="topic-card-count"></span>
        </span>
      </button>
      <button class="topic-card" data-topic="indices">
        <span class="topic-card-sample">x<span class="pow">3</span> × x<span class="pow">4</span></span>
        <span class="topic-card-title" data-i18n="topicIndices">Indices</span>
        <span class="topic-card-desc" data-i18n="topicIndicesDesc">Use the laws of indices to simplify powers</span>
        <span class="topic-card-progress" data-progress="indices">
          <span class="topic-card-bar"><span class="topic-card-bar-fill"></span></span>
          <span class="topic-card-count"></span>
        </span>
      </button>
      <button class="topic-card" data-topic="roots">
        <span class="topic-card-sample">(x + 3)² = 16</span>
        <span class="topic-card-title" data-i18n="topicRoots">Completing the square</span>
        <span class="topic-card-desc" data-i18n="topicRootsDesc">Square roots, completing the square and the quadratic formula</span>
        <span class="topic-card-progress" data-progress="roots">
          <span class="topic-card-bar"><span class="topic-card-bar-fill"></span></span>
          <span class="topic-card-count"></span>
        </span>
      </button>
      <button class="topic-card" data-topic="line">
        <span class="topic-card-sample">y = 2x + 3</span>
        <span class="topic-card-title" data-i18n="topicLine">Straight lines</span>
        <span class="topic-card-desc" data-i18n="topicLineDesc">Gradient, intercept and the equation of a line</span>
        <span class="topic-card-progress" data-progress="line">
          <span class="topic-card-bar"><span class="topic-card-bar-fill"></span></span>
          <span class="topic-card-count"></span>
        </span>
      </button>
    </div>
  </section>

  <!-- ===== Level select screen ===== -->
  <section class="screen" id="screenLevels" hidden>
    <div class="play-header">
      <button class="back-btn" id="levelsBackBtn"><span aria-hidden="true">←</span> <span data-i18n="backHome">Home</span></button>
      <button class="howto-btn levels-help-btn levels-formula-btn" id="levelsFormulaBtn" aria-label="Show the formulas for this topic" data-i18n-aria="formulaSheetAria" hidden>📐</button>
      <button class="howto-btn levels-help-btn" id="levelsHelpBtn" aria-label="How this topic works" data-i18n-aria="tutHelpAria">❔</button>
    </div>
    <div class="levels-head">
      <span class="topic-card-sample" id="levelsSample"></span>
      <h2 class="levels-title" id="levelsTitle"></h2>
      <p class="levels-summary" id="levelsSummary"></p>
    </div>
    <div class="levels-tiers" id="levelsTiers"></div>
  </section>

  <!-- ===== Play screen ===== -->
  <section class="screen" id="screenPlay" hidden>
    <div class="play-header">
      <button class="back-btn" id="backBtn"><span aria-hidden="true">←</span> <span id="backBtnLabel" data-i18n="backLevels">Levels</span></button>
      <span class="play-level-label" id="playLevelLabel"></span>
    </div>

    <div class="hud">
      <span data-i18n="scoreLabel">Score</span>&nbsp;<strong id="hudScore">0</strong>
      <span data-i18n="levelLabel">Level</span>&nbsp;<strong id="hudLevel">1 / 1</strong>
    </div>

    <p class="replay-banner" id="replayBanner" hidden></p>
    <p class="replay-banner tricky-banner" id="trickyBanner" hidden></p>

    <div class="step-progress" id="stepProgress"></div>

    <div class="equation-card pixel-card" id="equationCard">
      <p class="equation" id="equationText">x + 5 = 12</p>
    </div>

    <!-- Completing the square Hard: the quadratic formula, filled in once a, b and c are read off -->
    <div class="formula-panel" id="formulaPanel" hidden>
      <span class="fp-label" data-i18n="formulaPanelLabel">Quadratic formula</span>
      <div class="fp-math" id="fpMath"></div>
    </div>

    <!-- Straight lines with two points: the points on a grid, then the rise and run (graph.js showPlayGraph) -->
    <div class="play-graph" id="playGraph" hidden>
      <svg class="play-graph-svg" id="playGraphSvg" viewBox="0 0 280 280" role="img"></svg>
    </div>

    <p class="expand-prompt" id="expandPrompt" hidden></p>

    <div class="choices" id="choicesGrid"></div>

    <div class="replay-end" id="replayEnd" hidden>
      <p class="replay-end-note" id="replayEndNote"></p>
      <div class="replay-end-actions">
        <button class="complete-btn primary" id="replayTryBtn"></button>
        <button class="complete-btn secondary" id="replayLevelsBtn"></button>
      </div>
    </div>

    <div class="hint-text" id="hintText"></div>

    <div class="controls-row">
      <div class="hint-group">
        <button class="hint-btn" id="hintBtn" data-i18n="hintBtn">Hint (−2 pts)</button>
        <button class="hint-btn show-me-btn" id="showMeBtn" data-i18n="showMeBtn" hidden>Show me</button>
        <button class="hint-btn formula-btn" id="formulaBtn" data-i18n="formulaSheetBtn" hidden>📐 Formulas</button>
      </div>
      <div class="buddy">
        <p class="buddy-bubble" id="buddyBubble" aria-live="polite"></p>
        <div class="buddy-sprite" id="buddySprite" aria-hidden="true"></div>
      </div>
    </div>
  </section>
</main>

<script src="core/i18n.js"></script>
<script type="module">
  import { LEVELS, LEVELS_BY_TOPIC_AND_DIFFICULTY, ACHIEVEMENTS, TIER_TIPS } from "./levels.js";
  import { STRINGS } from "./strings.js";
  import { sfx, updateSoundBtn } from "./sound.js";
  import { showSystemGraph, showLineGraph, clearSystemGraph, showNumberLine, clearNumberLine, afterGraphDrawn, showPlayGraph } from "./graph.js";
  import { setMathText, appendWithPowers, makePow, eqUnits, eqLineLen } from "./mathtext.js";
  import { TOPIC_FORMULAS, formulaText, hasFormulas } from "./formulas.js";
  import { BUDDY_SVG, CHALKY_IDLES, buddyLine, makeBuddy } from "./chalky.js";
  import { CHOICE_PROMPT_KEYS, actionLabel, makeDistractors, practiceKinds, isLongChoice } from "./choices.js";
  import { initFloatingSymbols, burstGrandConfetti } from "./effects.js";

  // ---------- i18n ----------
  document.getElementById("langHost").addEventListener("change", () => {
    const hintWasShown = hintUsedThisStep;
    updateDailyCard();
    updateReviewCard();
    updateHomeCards();
    updateTrickyCard();
    updateSoundBtn();
    if (!$screenHome.hidden) homeSay(false);
    if (!$screenLevels.hidden) renderLevelSelect(location.hash.split("/")[1]);
    if ($achievementsModal.classList.contains("show")) renderAchievementsList();
    if ($tutorialOverlay.classList.contains("show")) openTutorial(tutTopic, tutAuto);
    if ($introOverlay.classList.contains("show")) showIntroStep(introStep);
    if (!$tipOverlay.hidden) { fillTierTip(); showTipText(false); }
    if (!$formulaOverlay.hidden) fillFormulaSheet();
    fillReplayText();
    // The play screen's top label and Chalky's end-of-replay line stay up during and after a replay,
    // which return below before render(), so they're redone here
    if (!$screenPlay.hidden) {
      fillPlayLevelLabel();
      if (!$replayEnd.hidden) buddyReact("celebrating", { line: buddyLine("replayDoneLine") || "That's the whole route. Your turn!", stay: true });
    }
    if (replaying) return;   // the replay keeps playing; redrawing would restart its step
    // Only redraw the game when it's on screen mid-level (a solved level has no current step).
    if ($screenPlay.hidden || !$completeOverlay.hidden || stepIndex >= currentLevel().steps.length) return;
    render();
    if (hintWasShown) {
      const level = currentLevel();
      const lang = currentLang();
      const hints = level.hints[lang] || level.hints.en;
      const hint = hints[stepIndex] || hints[hints.length - 1];
      setMathText($hintText, hint);
      hintUsedThisStep = true; // restore, so it won't double-charge the −2pt penalty later
    }
  });
  LLL_I18N.init(STRINGS, { switcherHost: document.getElementById("langHost") });
  document.getElementById("themeHost").appendChild(LLL_THEME.button());

  // ---------- game state ----------
  let levelIndex = 0;
  let stepIndex = 0;
  let score = 0;
  let hintUsedThisStep = false;
  let currentEquationText = "";
  let firstRender = true;
  let displayedEquationText = null;
  let completedLoops = 0;
  let activeTopic = "equation";
  let activeDifficulty = "easy";
  let activeLevels = levelsFor(activeTopic, activeDifficulty);
  let streak = 0;
  let hintUsedThisLevel = false;
  let unlockedAchievements = new Set();
  let totalSolves = 0;
  let dailyStreak = 0;
  let lastDailySolvedDate = null; // "YYYY-MM-DD" string
  let inDailyMode = false;
  let dailyLevel = null;
  let wrongThisLevel = 0;   // wrong taps on the current level (for stars)
  let levelProgress = {};   // { [level id]: { stars: 1–3 } } — best result per level
  let regularLevelState = null; // regular level's step/hint/wrong state, parked during Today's Challenge / Mixed Review
  let inReviewMode = false;
  let review = null;        // { levels, index, score, results: [{ topic, clean }] } — current Mixed Review session
  let reviewBest = 0;       // best Mixed Review session score
  let newAchievements = new Set();   // unlocked but not yet seen in the panel (lights the 🏆 dot)
  let wrongThisStep = 0;        // wrong taps on the current step (2 → "Show me" appears)
  let wrongStepKey = null;      // "level id:step" the counter belongs to, so a re-render doesn't reset it
  let watchedLevelId = null;    // level whose solution was watched; its next solve is capped at 1★
  let replaying = false;        // true while "Show me" is playing the solution
  let replayCapped = true;      // false when replaying a ★★★ level from the complete card (free practice)
  let mistakes = {};            // Tricky spots: { [kind]: { n, clean } } — n = slip count, clean = clean passes toward fading one
  let totalSlips = 0;           // all slips ever counted (unlocks the Tricky spots card at 10)
  let slipsThisStep = new Set();   // kinds already counted on the current step (once per step)

  // ---------- persistence ----------
  function saveProgress() {
    // During Today's Challenge / Mixed Review, save the parked regular-level state, not the side mode's.
    const reg = (inDailyMode || inReviewMode) && regularLevelState
      ? regularLevelState
      : { stepIndex, hintUsedThisLevel, wrongThisLevel };
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        activeTopic, activeDifficulty, levelIndex, score, completedLoops, streak,
        stepIndex: reg.stepIndex, hintUsedThisLevel: reg.hintUsedThisLevel, wrongThisLevel: reg.wrongThisLevel,
        levelProgress,
        unlockedAchievements: [...unlockedAchievements], totalSolves,
        dailyStreak, lastDailySolvedDate, reviewBest,
        newAchievements: [...newAchievements],
        watchedLevelId,
        mistakes, totalSlips
      }));
    } catch (e) { /* localStorage unavailable — fail silently */ }
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      const topic = LEVELS_BY_TOPIC_AND_DIFFICULTY[saved.activeTopic] ? saved.activeTopic : "equation";
      activeDifficulty = levelsFor(topic, saved.activeDifficulty).length ? saved.activeDifficulty : "easy";
      setActiveTopic(topic, false);
      if (typeof saved.levelIndex === "number" && saved.levelIndex < activeLevels.length) {
        levelIndex = saved.levelIndex;
        const totalSteps = activeLevels[levelIndex].steps.length;
        stepIndex = (typeof saved.stepIndex === "number" && saved.stepIndex < totalSteps) ? saved.stepIndex : 0;
        score = saved.score || 0;
        completedLoops = saved.completedLoops || 0;
        streak = saved.streak || 0;
        unlockedAchievements = new Set(saved.unlockedAchievements || []);
        totalSolves = saved.totalSolves || 0;
        dailyStreak = saved.dailyStreak || 0;
        lastDailySolvedDate = saved.lastDailySolvedDate || null;
        reviewBest = saved.reviewBest || 0;
        newAchievements = new Set(saved.newAchievements || []);
        watchedLevelId = saved.watchedLevelId || null;
        mistakes = (saved.mistakes && typeof saved.mistakes === "object") ? saved.mistakes : {};
        totalSlips = saved.totalSlips || 0;
        hintUsedThisLevel = !!saved.hintUsedThisLevel;
        wrongThisLevel = saved.wrongThisLevel || 0;
        levelProgress = (saved.levelProgress && typeof saved.levelProgress === "object") ? saved.levelProgress : {};
      }
    } catch (e) { /* corrupted/unavailable — start fresh */ }
  }

  // ---------- daily challenge helpers ----------
  // Local date, so Today's Challenge, "completed today" and the streak all roll over at local midnight
  function getDateKey(d = new Date()) {
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; // "YYYY-MM-DD"
  }

  function getDayOfYear(d = new Date()) {
    const start = new Date(d.getFullYear(), 0, 0);
    const diff = d - start;
    return Math.floor(diff / 86400000);
  }

  // Rotates through the topics day by day (Equations → Inequalities → … → Formulas → Equations),
  // stepping through each topic's Easy + Medium levels. Hard is left out because
  // Today's Challenge isn't locked behind progress.
  function getTodaysLevel() {
    const day = getDayOfYear();
    const topics = Object.keys(LEVELS_BY_TOPIC_AND_DIFFICULTY);
    const topic = topics[day % topics.length];
    const pool = LEVELS.filter(l => l.topic === topic && l.difficulty !== "hard");
    return pool[Math.floor(day / topics.length) % pool.length];
  }

  function isDailyCompletedToday() {
    return lastDailySolvedDate === getDateKey();
  }

  // Toasts queue up, so two achievements unlocked by the same solve (e.g. Tier Cleared +

  // silent: unlock without a toast (used to backfill achievements from existing progress on load)
  function unlockAchievement(id, { silent = false } = {}) {
    if (unlockedAchievements.has(id)) return;
    unlockedAchievements.add(id);
    const achievement = ACHIEVEMENTS.find(a => a.id === id);
    if (achievement && !silent) {
      const lang = currentLang();
      showAchievementToast(achievement.name[lang] || achievement.name.en);
      newAchievements.add(id);
      updateTrophyDot();
    }
    saveProgress();

  // `level` is the level just solved. Level Up checks its own difficulty, not activeDifficulty,
  // because during Today's Challenge activeDifficulty still holds the parked regular level's tier.
  function checkAchievements({ justSolved, isFirstSolveEver, tierJustCompleted, level }) {
    if (isFirstSolveEver) unlockAchievement("first_steps");
    if (streak === 3) unlockAchievement("on_a_roll");
    if (streak === 6) unlockAchievement("blazing");
    if (tierJustCompleted) unlockAchievement("tier_cleared");
    if (completedLoops >= 3) unlockAchievement("dedicated");
    if (justSolved && level && level.difficulty === "hard") unlockAchievement("level_up");
    checkTopicAchievements();
  }

  // How far along a per-topic achievement is, from levelProgress:
  //   warmup = Easy levels cleared · master = all levels cleared · perfect = stars earned (3 per level)
  function topicAchievementProgress(a) {
    const levels = a.kind === "warmup"
      ? levelsFor(a.topic, "easy")
      : LEVELS.filter(l => l.topic === a.topic);
    if (a.kind === "perfect") {
      const earned = levels.reduce((sum, l) => sum + ((levelProgress[l.id] || {}).stars || 0), 0);
      return { done: earned, total: levels.length * 3, stars: true };
    }
    return { done: levels.filter(l => levelProgress[l.id]).length, total: levels.length, stars: false };
  }

  // Worked out from levelProgress rather than the current solve, so the same check
  // also backfills per-topic achievements from existing progress on load.
  function checkTopicAchievements({ silent = false } = {}) {
    ACHIEVEMENTS.filter(a => a.topic).forEach(a => {
      if (unlockedAchievements.has(a.id)) return;
      const p = topicAchievementProgress(a);
      if (p.total && p.done >= p.total) unlockAchievement(a.id, { silent });
    });
  }

  // initFloatingSymbols() and burstGrandConfetti() live in effects.js.
  // CHOICE_PROMPT_KEYS, actionLabel() and makeDistractors() live in choices.js.

  // ---------- Chalky's "why that's wrong" feedback ----------
  // A wrong tap gets a line about the mistake, never the correct move.
  // Generated options carry a `kind` (choices.js); authored options (expand, factor, …)
  // get a tip for that step's move. Anything else falls back to the generic buddyWrong lines.
  const MISTAKE_KEYS = {
    notLcd: "mistakeNotLcd", forgotSign: "mistakeForgotSign", wrongWay: "mistakeWrongWay",
    wrongKind: "mistakeWrongKind", wrongNumber: "mistakeWrongNumber",
    // Expressions (authored wrong options tagged with wrongKinds)
    unlikeTerms: "mistakeUnlikeTerms", signSlip: "mistakeSignSlip", loneLetter: "mistakeLoneLetter",
    // Indices (also authored, tagged with wrongKinds)
    powerOp: "mistakePowerOp", coefficient: "mistakeCoefficient", lonePower: "mistakeLonePower",
    zeroPower: "mistakeZeroPower", negPower: "mistakeNegPower",
    // Completing the square (also authored, tagged with wrongKinds)
    plusMinus: "mistakePlusMinus", rootSlip: "mistakeRootSlip", undoSign: "mistakeUndoSign",
    halfB: "mistakeHalfB", addSquare: "mistakeAddSquare", discriminant: "mistakeDiscriminant", twoA: "mistakeTwoA",
    squareHalf: "mistakeSquareHalf", readCoef: "mistakeReadCoef",
    // Straight lines (also authored, tagged with wrongKinds; loneLetter is shared with Expressions)
    swapMC: "mistakeSwapMC", lineSign: "mistakeLineSign", riseRun: "mistakeRiseRun",
    subtractOrder: "mistakeSubtractOrder", findC: "mistakeFindC", rearrangeSlip: "mistakeRearrangeSlip",
    minusNegative: "mistakeMinusNegative"
  };
  const AUTHORED_TIP_KEYS = {
    expand: "mistakeTipExpand", factor: "mistakeTipFactor", roots: "mistakeTipRoots",
    combine: "mistakeTipCombine", substitute: "mistakeTipSubstitute", scale: "mistakeTipScale",
    simplify: "mistakeTipSimplify"
  };
  const MISTAKE_MS = 3500;   // longer than the old 1800 ms, so there's time to read the reason

  function mistakeLine(choice, step) {
    let key = MISTAKE_KEYS[choice.kind] || AUTHORED_TIP_KEYS[step.action];
    // Inequalities: dropping the minus sign also means the sign wouldn't flip
    if (choice.kind === "forgotSign" && currentLevel().topic === "inequality") key = "mistakeForgotSignIneq";
    // Quadratics' rearrange steps: the number isn't joined to x, it's being moved so one side is 0
    if (choice.kind === "wrongKind" && currentLevel().topic === "quadratic") key = "mistakeTipRearrange";
    // Formulas' letter moves: talk about the letter, not "the number"
    if (step.moves && choice.kind === "wrongNumber") key = "mistakeWrongLetter";
    if (step.moves && choice.kind === "wrongKind") key = "mistakeWrongKindLetter";
    // Indices: a generic slip shouldn't get Expressions' "add up the numbers in front" line
    if (step.law && !MISTAKE_KEYS[choice.kind]) key = "mistakeTipIndices";
    // Completing the square: a + / − step only moves a number that's added on; taking (b/2)² away instead of
    // adding it doesn't fill the square; a generic slip is the right side's sum (writing it as a square) or
    // the number next to x not moved (the last step)
    if (currentLevel().topic === "roots") {
      if (choice.kind === "wrongKind") key = "mistakeTipSquareAlone";
      else if (choice.kind === "wrongWay" && step.moves) key = "mistakeTipAddSquareWay";
      else if (choice.kind === "rootSlip" && step.action === "formula") key = "mistakeTipFormulaRoot";
      else if (choice.kind === "rootSlip" && step.action === "evalRoot") key = "mistakeTipCheckRoot";
      else if (choice.kind === "generic") key = step.action === "complete" ? "mistakeTipSquareSum" : "mistakeTipSolveRoots";
    }
    return (key && buddyLine(key)) || buddyLine("buddyWrong");
  }

  // ---------- Tricky spots: mistake tracking ----------
  // Each wrong tap records its mistake kind (once per kind per step). Getting a step right where
  // a kind was on offer, without slipping on it, is a clean pass; every 3 clean passes fade one slip.
  // Replays never count (their buttons can't be tapped).
  const MISTAKE_FADE_EVERY = 3;

  // The kind to track for a wrong option: authored-choice steps use "tip_<action>";
  // generated options use their kind, except "generic", which has nothing useful to practise.
  function trackedKind(choice, step) {
    // Expressions: authored options carry their own kind; "generic" slips aren't tracked
    if (Array.isArray(step.wrong) && choice.kind) return choice.kind === "generic" ? null : choice.kind;
    if (Array.isArray(step.wrong)) return `tip_${step.action}`;
    return choice.kind && choice.kind !== "generic" ? choice.kind : null;
  }

  function recordSlip(kind) {
    if (!kind || slipsThisStep.has(kind)) return;
    slipsThisStep.add(kind);
    const m = mistakes[kind] || (mistakes[kind] = { n: 0, clean: 0 });
    m.n++;
    m.clean = 0;   // a fresh slip restarts the fade
    totalSlips++;
    saveProgress();
  }

  // Called on a correct tap: every kind offered on this step that wasn't slipped on is a clean pass.
  function fadeMistakes() {
    stepKinds.forEach(kind => {
      const m = mistakes[kind];
      if (!m || slipsThisStep.has(kind)) return;
      if (++m.clean >= MISTAKE_FADE_EVERY) {
        m.clean = 0;
        if (--m.n <= 0) delete mistakes[kind];
      }
    });
  }

  // ---------- Tricky spots: home card ----------
  // Appears once 10 slips have ever been counted. Lists the top 3 kinds by count, each with its own
  // practice button. A button needs 3+ cleared levels where that kind can come up (practiceKinds in choices.js).
  const TRICKY_UNLOCK = 10;     // totalSlips needed before the card appears
  const TRICKY_ROWS = 3;        // kinds shown on the card
  const PRACTICE_LENGTH = 5;    // questions per session (fewer if the pool is small)
  const PRACTICE_MIN = 3;       // cleared matching levels needed to offer practice
  const TRICKY_ANNOUNCED_KEY = "lll_algebra_tricky_announced";
  let trickyAnnounced = false;
  try { trickyAnnounced = localStorage.getItem(TRICKY_ANNOUNCED_KEY) === "1"; } catch (e) { /* fail silently */ }

  // forgotSign → trickyForgotSign · tip_expand → trickyTipExpand
  function trickyLabel(kind) {
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    const key = kind.startsWith("tip_") ? `trickyTip${cap(kind.slice(4))}` : `tricky${cap(kind)}`;
    return LLL_I18N.t(key) || kind;
  }

  // Cleared levels with at least one step where this kind of slip is on offer
  function practicePool(kind) {
    return clearedLevels().filter(l => l.steps.some(s => [...practiceKinds(s)].includes(kind)));
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function updateTrickyCard() {
    const t = (k, fb) => LLL_I18N.t(k) || fb;
    $trickyCard.hidden = totalSlips < TRICKY_UNLOCK;
    if ($trickyCard.hidden) return;
    const top = Object.entries(mistakes)
      .filter(([, m]) => m.n > 0)
      .sort((a, b) => b[1].n - a[1].n)
      .slice(0, TRICKY_ROWS);
    if (!top.length) {
      $trickyRows.innerHTML = `<p class="tricky-none">${t("trickyNone", "No tricky spots right now. Nice work!")}</p>`;
      return;
    }
    const rows = top.map(([kind, m]) => {
      const poolSize = practicePool(kind).length;
      return { kind, m, poolSize, ready: poolSize >= PRACTICE_MIN };
    });
    const accentKind = (rows.find(r => r.ready) || {}).kind;   // first row that can be practised
    $trickyRows.innerHTML = rows.map(({ kind, m, poolSize, ready }) => {
      const btnText = ready
        ? t("trickyPractiseBtn", "Practise {n}").split("{n}").join(Math.min(PRACTICE_LENGTH, poolSize))
        : t("trickyMoreBtn", "Clear more levels");
      return `
        <div class="tricky-row">
          <span class="tricky-row-label">${trickyLabel(kind)}
            <span class="tricky-row-count">${t("trickyCount", "{n}×").split("{n}").join(m.n)}</span></span>
          <button class="tricky-btn${kind === accentKind ? " top" : ""}" data-kind="${kind}"${ready ? "" : " disabled"}>${btnText}</button>
        </div>`;
    }).join("");
  }

  $trickyRows.addEventListener("click", (e) => {
    const btn = e.target.closest(".tricky-btn");
    if (btn && !btn.disabled) go(`#tricky/${btn.dataset.kind}`);
  });
  
  // Press Start 2P has no ≤ / ≥ glyphs, so draw them as the pixel < / > with an underline bar.
  const PIXEL_INEQ = { "≤": "<", "≥": ">" };
  const INEQ_SIGN = /[<>≤≥]/;
  let flipPending = false; // true while a flip step's result is being typed

  function appendEqChar(ch, cls = null) {
    if (cls) {   // a coloured number on the "a = 1, b = 5, c = -24" line
      const s = document.createElement("span");
      s.className = cls;
      s.textContent = ch;
      $eq.appendChild(s);
    } else if (ch.length > 1 && ch[0] === "^") {   // a whole power from eqUnits(), e.g. "^3" or "^-1"
      $eq.appendChild(makePow(ch.slice(1), "-"));
    } else if (ch.length > 1 && "√{_".includes(ch[0])) {   // a whole root ("√121"), stacked fraction ("{9}/{3}") or subscript ("_1")
      appendWithPowers($eq, ch, "-");
    } else if (INEQ_SIGN.test(ch)) {
      const s = document.createElement("span");
      s.className = "ineq-sign" + (PIXEL_INEQ[ch] ? " pixel-ineq" : "") + (flipPending ? " flip-pending" : "");
      s.textContent = PIXEL_INEQ[ch] || ch;
      $eq.appendChild(s);
    } else {
      $eq.appendChild(document.createTextNode(ch));
    }
  }

  function playFlipCue() {
    flipPending = false;
    const sign = $eq.querySelector(".ineq-sign.flip-pending");
    if (sign) sign.classList.replace("flip-pending", "flip-cue");
  }

  // Completing the square Hard: on the "a = 1, b = 5, c = -24" line, each number takes its letter's colour
  // (the same colours as the formula panel). One class (or null) per unit from eqUnits().
  const COEF_LINE = /^a = -?\d+, b = -?\d+, c = -?\d+$/m;
  function coefClasses(units) {
    const classes = units.map(() => null);
    const text = units.join("");
    const line = COEF_LINE.exec(text);
    if (!line) return classes;
    const marks = new Map();   // character position → class
    for (const m of line[0].matchAll(/([abc]) = (-?\d+)/g)) {
      const start = line.index + m.index + m[0].length - m[2].length;
      for (let i = 0; i < m[2].length; i++) marks.set(start + i, "v-" + m[1]);
    }
    let pos = 0;
    units.forEach((u, i) => { classes[i] = marks.get(pos) || null; pos += u.length; });
    return classes;
  }

  // Longest line of an equation, in characters. Press Start 2P is fixed-width, so brand.css
  // uses this (--eq-len) to shrink a long equation until it fits the card on one line.
  function setEqLen(el, text) {
    el.style.setProperty("--eq-len", Math.max(...text.split("\n").map(eqLineLen)));
  }

  function renderEqText(text) {
    $eq.textContent = "";
    const units = eqUnits(text), classes = coefClasses(units);
    units.forEach((ch, i) => appendEqChar(ch, classes[i]));
  }

  function setEquationText(text, onDone) {
    if (text === displayedEquationText) { if (onDone) onDone(); return; }   // skip redundant fade
    displayedEquationText = text;

    if (firstRender) {
      setEqLen($eq, text);
      renderEqText(text);
      firstRender = false;
      if (onDone) onDone();
      return;
    }
    $eq.classList.add("updating");
    setTimeout(() => {
      $eq.classList.remove("updating");
      setEqLen($eq, text);   // the full text's size from the start, so it doesn't change while typing
      typewriterReveal(text, onDone);
    }, 220);
  }

  function typewriterReveal(text, onDone) {
    $eq.textContent = "";
    const chars = eqUnits(text);   // a power ("^3") types as one unit
    const classes = coefClasses(chars);
    let i = 0;
    const speed = 28; // ms per character
    function typeChar() {
      if (i < chars.length) {
        appendEqChar(chars[i], classes[i]);
        i++;
        setTimeout(typeChar, speed);
      } else if (onDone) {
        onDone();
      }
    }
    typeChar();
  }

  // ---------- Completing the square Hard: the quadratic formula panel ----------
  // Once "Read off a, b and c" (the step with fill: "formula") is answered, the formula under the card
  // fills in b, then a, then c (the level's `abc`), and stays for the rest of the level.
  // A step's `focus` lights up the part it uses: "disc" (b² − 4ac) or "top" (the top of the fraction).
  const $formulaPanel = document.getElementById("formulaPanel");
  const $fpMath = document.getElementById("fpMath");
  const FILL_ORDER = ["b", "a", "c"];
  const FILL_GAP_MS = 650;   // between letters
  let panelTimers = [];

  function panelLater(fn, ms) { panelTimers.push(setTimeout(fn, ms)); }
  function clearPanelTimers() { panelTimers.forEach(clearTimeout); panelTimers = []; }
  function coefShown(v) { return v < 0 ? `(−${-v})` : `${v}`; }

  // x = (−b ± √(b² − 4·a·c)) / 2·a, as three groups that each stay on one line (it wraps between them on a phone).
  // filled: numbers in place of the letters, with the "·" between them showing.
  function buildFormulaPanel(level, filled) {
    const [a, b, c] = level.abc;
    const vals = { a, b, c };
    const el = (cls, text) => {
      const e = document.createElement("span");
      e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    };
    const v = name => {
      const e = el("fp-var " + name, filled ? coefShown(vals[name]) : name);
      e.dataset.v = name;
      return e;
    };
    const dot = () => el("fp-dot" + (filled ? " show" : ""), "·");
    const disc = el("fp-focus fp-disc");
    disc.append(v("b"), "² − 4", dot(), v("a"), dot(), v("c"));
    const top = el("fp-group fp-focus fp-top");
    top.append("(−", v("b"), " ± √(", disc, "))");
    const bottom = el("fp-group", "/ 2");
    bottom.append(dot(), v("a"));
    $fpMath.textContent = "";
    $fpMath.append(el("fp-group", "x ="), " ", top, " ", bottom);   // spaces between groups, so they survive a wrap
    $formulaPanel.dataset.level = level.id;
  }

  function showFormulaPanel() {
    $formulaPanel.hidden = false;
    void $formulaPanel.offsetWidth;   // so the fade-in runs
    $formulaPanel.classList.add("show");
  }

  function hideFormulaPanel() {
    clearPanelTimers();
    $formulaPanel.hidden = true;
    $formulaPanel.classList.remove("show");
    delete $formulaPanel.dataset.level;
  }

  // Called by render(): the panel shows (already filled) on every step after the fill step,
  // so resuming mid-level, "Show me" and Mixed Review all get it. A fill still running is left alone.
  function syncFormulaPanel(level) {
    const fillAt = level.abc ? level.steps.findIndex(s => s.fill === "formula") : -1;
    if (fillAt < 0 || stepIndex <= fillAt) { hideFormulaPanel(); return; }
    if ($formulaPanel.hidden || $formulaPanel.dataset.level !== level.id) {
      clearPanelTimers();
      buildFormulaPanel(level, true);
      showFormulaPanel();
    }
    const focus = (level.steps[stepIndex] || {}).focus;
    $fpMath.querySelector(".fp-disc").classList.toggle("on", focus === "disc");
    $fpMath.querySelector(".fp-top").classList.toggle("on", focus === "top");
  }

  // The fill itself: each letter flips to its number, b first, then a, then c. done() runs once it's finished.
  function animateFormulaPanel(level, done) {
    clearPanelTimers();
    if (REDUCED_MOTION) {
      buildFormulaPanel(level, true);
      showFormulaPanel();
      if (done) done();
      return;
    }
    buildFormulaPanel(level, false);
    showFormulaPanel();
    const vals = { a: level.abc[0], b: level.abc[1], c: level.abc[2] };
    FILL_ORDER.forEach((name, k) => panelLater(() => {
      const spans = $fpMath.querySelectorAll(`.fp-var[data-v="${name}"]`);
      spans.forEach(s => s.classList.add("flip"));
      panelLater(() => spans.forEach(s => {
        s.textContent = coefShown(vals[name]);
        s.classList.remove("flip");
        s.classList.add("pop");
      }), 180);
      if (name === "c") panelLater(() => $fpMath.querySelectorAll(".fp-dot").forEach(d => d.classList.add("show")), 200);
      if (k === FILL_ORDER.length - 1 && done) panelLater(done, 900);
    }, 450 + k * FILL_GAP_MS));
  }

  // Text above the choices: the step's own prompt ("Factorise:"), Quadratics' "To make one side 0:",
  // or the Formulas topic's "Make x the subject:" (letter from level.subject). Empty when there's none.
  function choicePrompt(level, step) {
    // A step can name its own prompt (Completing the square Medium: "Move the number across:"); it wins over the rest
    if (step.prompt) return LLL_I18N.t(step.prompt) || "";
    // Indices: "Use the multiply rule:" etc., one prompt per law. Checked first, so it wins over simplifyPrompt.
    const LAW_PROMPT_KEYS = { multiply: "lawMultiplyPrompt", divide: "lawDividePrompt", power: "lawPowerPrompt",
                              zero: "lawZeroPrompt", positive: "lawPositivePrompt" };
    if (step.law) return LLL_I18N.t(LAW_PROMPT_KEYS[step.law]) || "";
    // Expressions: "Collect the x terms:" / "Collect the numbers:". Checked first, so it wins over simplifyPrompt.
    if (step.collect) {
      return step.collect === "number"
        ? (LLL_I18N.t("collectNumbersPrompt") || "")
        : (LLL_I18N.t("collectPrompt") || "").split("{letter}").join(step.collect);
    }
    // Completing the square: the last step solves x ± a = ±r ("Solve for x:"), not Quadratics' "Set each bracket to 0"
    if (level.topic === "roots" && step.action === "roots") return LLL_I18N.t("rootsSolvePrompt") || "";
    const key = CHOICE_PROMPT_KEYS[step.action]
      || (level.topic === "quadratic" ? "rearrangePrompt" : null)
      || (level.topic === "roots" ? "squareAlonePrompt" : null)
      || (level.subject ? "subjectPrompt" : null);
    return key ? (LLL_I18N.t(key) || "").split("{letter}").join(level.subject || "") : "";
  }

  // "Completing the square · Hard" above the card
  function fillPlayLevelLabel() {
    const level = currentLevel();
    $playLevelLabel.textContent =
      `${LLL_I18N.t(TOPIC_LABEL_KEYS[level.topic]) || level.topic} · ${LLL_I18N.t(TIER_LABEL_KEYS[level.difficulty]) || level.difficulty}`;
  }

  function render() {
    const level = currentLevel();
    // Starting a level: a watched solution still counts as a hint (1★ max), including after "Try it yourself"
    // Mixed Review keeps its own per-question flag, so watching there never caps the level in normal play
    if (stepIndex === 0) {
      hintUsedThisLevel = inReviewMode
        ? review.watchedIndex === review.index
        : !inDailyMode && watchedLevelId === level.id;
      wrongThisLevel = 0;
    }
    const stepKey = `${level.id}:${stepIndex}`;
    if (stepKey !== wrongStepKey) { wrongStepKey = stepKey; wrongThisStep = 0; slipsThisStep = new Set(); }
    // Derive the text from the level + step, so resuming mid-level (after a refresh,
    // Today's Challenge, or another screen) always shows the right intermediate step.
    currentEquationText = stepIndex === 0 ? level.equation : level.steps[stepIndex - 1].result;
    setEquationText(currentEquationText);
    $hudLevel.textContent = inDailyMode
      ? (LLL_I18N.t("dailyTitle") || "Today's Challenge")
      : inReviewMode
        ? `${review.index + 1} / ${review.levels.length}`
        : `${levelIndex + 1} / ${activeLevels.length}`;
    fillPlayLevelLabel();
    $hudScore.textContent = inReviewMode ? review.score : score;
    const practice = inReviewMode && review.practice;
    $trickyBanner.hidden = !practice || replaying;
    if (practice) {
      $trickyBanner.textContent = `🎯 ${LLL_I18N.t("trickyTitleShort") || "Tricky spots"} · ${trickyLabel(practice.kind)} · ${review.index + 1} / ${review.levels.length}`;
    }
    $hintText.textContent = "";
    buildStepDots(level.steps.length);
    updateStepDots(stepIndex, level.steps.length, false);
    if (stepIndex === 0) $equationCard.classList.remove("solved");
    // Reserve two lines when any step shows two (Systems, and Completing the square Hard's a, b, c and b² − 4ac lines)
    $equationCard.classList.toggle("system-card", level.topic === "system" || level.steps.some(s => s.result.includes("\n")));
    // Straight lines Medium: room for a stacked fraction under the points
    $equationCard.classList.toggle("frac-card", level.equation.includes("}/{"));

    syncFormulaPanel(level);
    showPlayGraph(level, stepIndex);   // Straight lines with two points; hidden for everything else
    updateFormulaBtn(level);   // follows each question's topic (Mixed Review, Tricky spots, Today's Challenge)

    const step = currentStep();
    // Authored-choice steps (expand, factor, roots) carry their own wrong options;
    // every other step gets generated distractors.
    const isAuthored = Array.isArray(step.wrong);
    const prompt = choicePrompt(level, step);
    $expandPrompt.hidden = !prompt;
    $expandPrompt.textContent = prompt;
    const distractors = isAuthored
      ? step.wrong.map((w, i) => ({ action: step.action, value: w, kind: (step.wrongKinds || [])[i] }))
      : makeDistractors(step);
    stepKinds = new Set(distractors.map(d => trackedKind(d, step)).filter(Boolean));
    const choices = [{ action: step.action, value: step.value }, ...distractors];
    for (let i = choices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [choices[i], choices[j]] = [choices[j], choices[i]];
    }

    $choices.innerHTML = "";
    choices.forEach(choice => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      const label = actionLabel(choice.action, choice.value);
      if (isLongChoice(label)) btn.classList.add("long");   // 12px on narrow phones (e.g. the quadratic formula)
      appendWithPowers(btn, label);
      // What Chalky says for this move in a replay: a stacked fraction's textContent would run its top and
      // bottom together ("4 − (−5)1 − (−2)"), so it's written inline instead: "(4 − (−5))/(1 − (−2))"
      btn.dataset.say = label.replace(/\{([^{}]*)\}\/\{([^{}]*)\}/g, "($1)/($2)");
      if (choice.action === step.action && choice.value === step.value) btn.dataset.correct = "1";
      btn.addEventListener("click", () => handleChoice(choice, btn, step));
      $choices.appendChild(btn);
    });

    if (stepIndex === 0) buddyIdle();   // new level → calm; mid-level steps keep their reaction
    hintUsedThisStep = false;
    updateShowMeBtn();
  }

  function handleChoice(choice, btn, correctStep) {
    const isCorrect = choice.action === correctStep.action && choice.value === correctStep.value;
    [...$choices.children].forEach(b => b.disabled = true);

    if (isCorrect) {
      btn.classList.add("correct");
      $showMeBtn.hidden = true;   // this step's done
      fadeMistakes();             // saved by the saveProgress() further down
      const prevText = currentEquationText;
      currentEquationText = correctStep.result;
      flipPending = !!correctStep.flip;
      // Completing the square Hard: after "Read off a, b and c", the formula panel fills in once the card has
      // typed, and the next step's buttons wait for it (unless the player has left or tapped "Show me" meanwhile)
      const fillLevel = correctStep.fill === "formula" ? currentLevel() : null;
      const fillAt = stepIndex + 1;
      const fillThenRender = () => {
        $choices.innerHTML = "";
        $expandPrompt.hidden = true;
        animateFormulaPanel(fillLevel, () => {
          if (!replaying && !$screenPlay.hidden && currentLevel() === fillLevel && stepIndex === fillAt) render();
        });
      };
      setEquationText(currentEquationText, correctStep.flip ? playFlipCue : fillLevel ? fillThenRender : null);
      if (correctStep.flip) {
        const from = (prevText.match(INEQ_SIGN) || [""])[0];
        const to = (correctStep.result.match(INEQ_SIGN) || [""])[0];
        $hintText.textContent = (LLL_I18N.t("flipMsg") || "Sign flipped: {from} → {to}")
          .split("{from}").join(from).split("{to}").join(to);
      }
      burstChalkDust();

      stepIndex++;
      const totalSteps = currentLevel().steps.length;
      const justSolved = stepIndex >= totalSteps;
      if (justSolved) sfx.solve(); else sfx.step(stepIndex);
      // Always reacts; only sometimes speaks on a normal correct step, so it doesn't get noisy
      if (justSolved) buddyReact("celebrating", { line: buddyLine("buddySolved"), stay: true });
      else buddyReact("happy", { line: Math.random() < 0.35 ? buddyLine("buddyCorrect") : "", ms: 1400 });
      updateStepDots(stepIndex, totalSteps, justSolved);
      if (justSolved) {
        $equationCard.classList.add("solved");
        // Only the capped solve of that same level uses the flag up (not a Mixed Review / Today's Challenge solve)
        if (!inReviewMode && !inDailyMode && watchedLevelId === currentLevel().id) watchedLevelId = null;
      }
      saveProgress();

      if (justSolved && inReviewMode) {
        finishReviewLevel(correctStep);
      } else if (justSolved) {
        const level = currentLevel();
        const wasDaily = inDailyMode;
        score += level.basePoints;
        totalSolves++;
        const isFirstSolveEver = totalSolves === 1;
        let streakBonus = 0;
        if (hintUsedThisLevel) {
          streak = 0;
        } else {
          streak++;
          if (streak % 3 === 0) {
            streakBonus = 5;
            score += streakBonus;
          }
        }
        $hudScore.textContent = score;

        const result = {
          hash: location.hash, daily: wasDaily, level,
          basePoints: level.basePoints, streakBonus, streakCount: streak,
          stars: 0, newBest: false, tierJustCompleted: false, topicJustMastered: false
        };
        if (wasDaily) {
          const today = getDateKey();
          const yesterday = getDateKey(new Date(Date.now() - 86400000));
          dailyStreak = (lastDailySolvedDate === yesterday) ? dailyStreak + 1 : 1;
          lastDailySolvedDate = today;
          updateDailyCard();
          leaveDaily();
        } else {
          const prevBest = (levelProgress[level.id] || {}).stars || 0;
          const mastered = () => { const s = topicStats(level.topic); return s.cleared === s.total; };
          const wasMastered = mastered();
          result.stars = recordLevelResult(level);
          result.topicJustMastered = !wasMastered && mastered();
          result.newBest = prevBest > 0 && result.stars > prevBest;
          result.tierJustCompleted = !nextLevelInTier(level);
          if (result.tierJustCompleted) completedLoops++;
        }
        saveProgress();
        checkAchievements({ justSolved: true, isFirstSolveEver, tierJustCompleted: result.tierJustCompleted, level });
        // Let the solved card + typewriter finish before the overlay appears
        // (longer on a sign flip, so the flip animation and message can be seen).
        setTimeout(() => showCompleteOverlay(result), correctStep.flip ? 1500 : 900);
      } else if (!fillLevel) {
        setTimeout(() => { if (!replaying) render(); }, 600);
      }
    } else {
      btn.classList.add("wrong");
      wrongThisLevel++;
      wrongThisStep++;
      updateShowMeBtn();
      const slipKind = trackedKind(choice, correctStep);
      recordSlip(slipKind);
      // Practice summary: ✗ only for a slip of the kind being practised
      if (inReviewMode && review.practice && slipKind === review.practice.kind) review.slipped.add(review.index);
      sfx.wrong();
      $eq.classList.remove("wrong-shake");
      void $eq.offsetWidth; // restart animation
      $eq.classList.add("wrong-shake");
      // Chalky says what went wrong (not the answer), so a hint already on screen isn't overwritten
      buddyReact("oops", { line: mistakeLine(choice, correctStep), ms: MISTAKE_MS });
      setTimeout(() => {
        if (replaying) return;   // "Show me" was tapped meanwhile; its buttons stay locked
        [...$choices.children].forEach(b => { b.disabled = false; b.classList.remove("wrong"); });
      }, 700);
    }
  }

  function levelsFor(topic, tier) {
    return (LEVELS_BY_TOPIC_AND_DIFFICULTY[topic] || {})[tier] || [];
  }

  function setActiveTier(tier, resetPosition = true) {
    activeDifficulty = levelsFor(activeTopic, tier).length ? tier : "easy";
    activeLevels = levelsFor(activeTopic, activeDifficulty);
    if (resetPosition) {
      levelIndex = 0;
      stepIndex = 0;
    }
  }

  function setActiveTopic(topic, resetPosition = true) {
    activeTopic = LEVELS_BY_TOPIC_AND_DIFFICULTY[topic] ? topic : "equation";
    setActiveTier(activeDifficulty, resetPosition); // keep the current difficulty, swap its level list
  }

  $hintBtn.addEventListener("click", () => {
    const level = currentLevel();
    const lang = currentLang();
    const hints = level.hints[lang] || level.hints.en;
    const hint = hints[stepIndex] || hints[hints.length - 1];
    setMathText($hintText, hint);
    buddyReact("thinking", { line: buddyLine("buddyHint"), ms: 2800 });
    hintUsedThisLevel = true;
    if (!hintUsedThisStep) {
      if (inReviewMode) review.score = Math.max(0, review.score - 2);
      else score = Math.max(0, score - 2);
      $hudScore.textContent = inReviewMode ? review.score : score;
      hintUsedThisStep = true;
    }
  });

  // ---------- "Show me" replay ----------
  // Plays the solution on the real play screen (same card, step dots and choice buttons), with Chalky narrating.
  // Offered after 2 wrong taps on one step (plays from that step) and on the level-complete card (from the start).
  // Watching counts as a hint: −2 pts once, and that level's next solve is capped at 1★ (watchedLevelId),
  // which carries through "Try it yourself". Not offered in Today's Challenge.
  const REPLAY_STEP_MS = 2800;   // time per step
  const REPLAY_TAP_MS = 1100;    // the correct button pulses
  const REPLAY_MOVE_MS = 1600;   // the move is made
  let replayTimers = [];

  function replayLater(fn, ms) { replayTimers.push(setTimeout(fn, ms)); }
  function clearReplayTimers() { replayTimers.forEach(clearTimeout); replayTimers = []; }

  function updateShowMeBtn() {
    $showMeBtn.hidden = inDailyMode || replaying || wrongThisStep < 2;
  }

  function fillReplayText() {
    const t = (k, fb) => LLL_I18N.t(k) || fb;
    // A ★★★ level replayed from the complete card is free practice, so no cap is mentioned
    // Mixed Review has no stars: watching costs the −2 and the ✓ on the summary instead
    // Practice only marks slips of its own kind, so watching costs the −2 and nothing else
    const practice = inReviewMode && review && review.practice;
    $replayBanner.textContent = practice
      ? t("replayBannerPractice", "Replay · just watching")
      : inReviewMode
      ? t("replayBannerReview", "Replay · this one won't count as flawless")
      : replayCapped
        ? t("replayBanner", "Replay · this level is capped at 1★")
        : t("replayBannerFree", "Replay · your ★★★ is safe");
    $replayEndNote.textContent = practice
      ? t("replayEndNotePractice", "You watched the solution · now try it yourself")
      : inReviewMode
      ? t("replayEndNoteReview", "You watched the solution · this one won't count as flawless")
      : replayCapped
        ? t("replayEndNote", "Watched the solution · this try earns up to 1★")
        : t("replayEndNoteFree", "You've already got ★★★ here, so this one's just practice");
    $replayTryBtn.textContent = t("replayTryBtn", "Try it yourself");
    $replayLevelsBtn.textContent = t("levelSelectBtn", "Level select");
    $completeWatchBtn.textContent = t("completeWatchBtn", "See how it's solved");
  }

  function setReplayUi(on) {
    replaying = on;
    $replayBanner.hidden = !on;
    if (on) $trickyBanner.hidden = true;   // one banner at a time; render() brings it back after
    $hintBtn.hidden = on;
    updateFormulaBtn();
    $replayEnd.hidden = true;
    updateShowMeBtn();
  }

  // charge = take the −2 pts (not when watching from the complete card, the level's already scored)
  // cap = the level's next solve is capped at 1★ (off for a ★★★ level, there's nothing left to protect)
  function startReplay(fromStep, { charge = true, cap = true } = {}) {
    const level = currentLevel();
    if (fromStep >= level.steps.length) return;   // already solved
    const alreadyWatched = inReviewMode ? review.watchedIndex === review.index : watchedLevelId === level.id;
    if (charge && !alreadyWatched) {
      if (inReviewMode) review.score = Math.max(0, review.score - 2);
      else score = Math.max(0, score - 2);
    }
    replayCapped = cap;
    if (cap) {
      if (inReviewMode) review.watchedIndex = review.index;   // this question only
      else watchedLevelId = level.id;
      hintUsedThisLevel = true;
    }
    // Mid-level: the step's buttons are already on screen, so the replay keeps them
    const keepChoices = fromStep === stepIndex && $choices.children.length > 0;
    clearReplayTimers();
    fillReplayText();
    setReplayUi(true);
    stepIndex = fromStep;
    saveProgress();
    playReplayStep(level, keepChoices);
  }

  function playReplayStep(level, keepChoices = false) {
    if (keepChoices) {
      // Same options the player was stuck on; just show the −2 and clear the wrong-tap marks
      $hudScore.textContent = inReviewMode ? review.score : score;
      [...$choices.children].forEach(b => b.classList.remove("wrong"));
    } else {
      render();   // this step's real choices, with the correct one marked
    }
    const step = currentStep();
    [...$choices.children].forEach(b => { b.disabled = true; b.tabIndex = -1; });
    const correctBtn = $choices.querySelector('[data-correct="1"]');

    // The step's hint explains the move; Chalky says which move it is
    const hints = level.hints[currentLang()] || level.hints.en;
    setMathText($hintText, hints[stepIndex] || hints[hints.length - 1]);
    const line = (buddyLine("replayStepLine") || "Step {n}: {move}")
      .split("{n}").join(stepIndex + 1)
      .split("{move}").join(correctBtn ? (correctBtn.dataset.say || correctBtn.textContent) : "");
    buddyReact("thinking", { line, stay: true });

    replayLater(() => correctBtn && correctBtn.classList.add("intro-demo-tap"), REPLAY_TAP_MS);
    replayLater(() => {
      if (correctBtn) { correctBtn.classList.remove("intro-demo-tap"); correctBtn.classList.add("correct"); }
      flipPending = !!step.flip;
      currentEquationText = step.result;
      // Completing the square Hard: the formula panel fills in after "Read off a, b and c", then the replay goes on
      const fills = step.fill === "formula";
      const nextStep = () => replayLater(() => playReplayStep(level), REPLAY_STEP_MS - REPLAY_MOVE_MS);
      setEquationText(step.result, step.flip ? playFlipCue
        : fills ? () => animateFormulaPanel(level, () => { if (replaying && currentLevel() === level) nextStep(); })
        : null);
      burstChalkDust();
      stepIndex++;
      showPlayGraph(level, stepIndex);   // the replay doesn't re-render between steps, so the rise and run draw in here
      const done = stepIndex >= level.steps.length;
      updateStepDots(stepIndex, level.steps.length, done);
      sfx.step(stepIndex);
      if (done) {
        $equationCard.classList.add("solved");
        finishReplay();
      } else if (!fills) {
        nextStep();
      }
    }, REPLAY_MOVE_MS);
  }

  function finishReplay() {
    replayLater(() => {
      $choices.innerHTML = "";
      $expandPrompt.hidden = true;
      $hintText.textContent = "";
      $replayEnd.hidden = false;
      $replayLevelsBtn.hidden = inReviewMode;   // in Mixed Review the only way on is to try it
      $replayTryBtn.focus({ preventScroll: true });
      buddyReact("celebrating", { line: buddyLine("replayDoneLine") || "That's the whole route. Your turn!", stay: true });
    }, 900);
  }

  // Leaving mid-replay goes back to the start of the level, so a replay can't be used to skip steps
  function cancelReplay() {
    if (!replaying) return;
    clearReplayTimers();
    clearPanelTimers();
    setReplayUi(false);
    stepIndex = 0;
  }

  function watchFromComplete() {
    const best = (levelProgress[currentLevel().id] || {}).stars || 0;
    hideCompleteOverlay();
    startReplay(0, { charge: false, cap: best < 3 });
  }

  // On a ★★★ level there's nothing left to cap, so "Show me" only costs the −2 (like "See how it's solved").
  // Mixed Review always marks the question as watched.
  $showMeBtn.addEventListener("click", () => {
    const best = (levelProgress[currentLevel().id] || {}).stars || 0;
    startReplay(stepIndex, { cap: inReviewMode || best < 3 });
  });

  $replayTryBtn.addEventListener("click", () => {
    clearReplayTimers();
    setReplayUi(false);
    stepIndex = 0;
    wrongStepKey = null;
    saveProgress();
    render();
    buddyReact("happy", { line: buddyLine("replayTryLine") || "Same steps, your taps.", ms: 2200 });
  });

  $replayLevelsBtn.addEventListener("click", () => go(`#levels/${currentLevel().topic}`));

  // ---------- Systems graph (level-complete card) ----------
  // Drawn by graph.js (showSystemGraph / clearSystemGraph / afterGraphDrawn).

  // ---------- level-complete overlay ----------
  function nextLevelInTier(level) {
    const list = levelsFor(level.topic, level.difficulty);
    return list[list.indexOf(level) + 1] || null;
  }

  // Next level to offer: the next one in this tier, else the first level of the next tier.
  function nextLevelAfter(level) {
    const inTier = nextLevelInTier(level);
    if (inTier) return inTier;
    const nextTier = TIERS[TIERS.indexOf(level.difficulty) + 1];
    return nextTier ? (levelsFor(level.topic, nextTier)[0] || null) : null;
  }

  // Chalky on the level-complete card / Mixed Review summary. keepBubble so his line stays up.
  const completeBuddy = makeBuddy(document.getElementById("completeBuddy"), document.getElementById("completeBubble"), { keepBubble: true });

  // Random line from `key` with {vars} filled in; he holds that face until the card closes.
  function completeChalky(mood, key, vars = {}, look = null) {
    const line = Object.entries(vars).reduce((s, [k, v]) => s.split(`{${k}}`).join(v), buddyLine(key));
    completeBuddy.react(mood, { line, stay: true, look });   // the card is a still moment, so his face matches his line until it closes
  }

  let completeActions = {};

  function showCompleteOverlay(r) {
    if (location.hash !== r.hash) return; // player already navigated away
    const t = k => LLL_I18N.t(k) || "";
    const tierName = t(TIER_LABEL_KEYS[r.level.difficulty]);

    if (r.daily) {
      $completeKicker.textContent = t("dailyClear") || "Challenge complete!";
      $completeSub.textContent = t("dailyTitle");
      $completeStars.hidden = true;
      $completeBest.hidden = true;
    } else {
      const n = levelsFor(r.level.topic, r.level.difficulty).indexOf(r.level) + 1;
      $completeKicker.textContent = r.tierJustCompleted
        ? (t("tierComplete") || "{tier} complete!").split("{tier}").join(tierName)
        : (t("levelClear") || "Level clear!");
      $completeSub.textContent = `${t(TOPIC_LABEL_KEYS[r.level.topic])} · ${tierName} ${n}`;
      $completeStars.hidden = false;
      $completeStars.innerHTML = [1, 2, 3].map(i =>
        `<span class="big-star${i <= r.stars ? " on" : ""}" style="animation-delay:${0.15 + i * 0.18}s">★</span>`).join("");
      $completeBest.hidden = !r.newBest;
      $completeBest.textContent = t("newBest") || "New best!";
    }

    $completePoints.textContent = `+${r.basePoints} ${t("ptsLabel") || "pts"}`;
    $completeBonus.hidden = !r.streakBonus;
    $completeBonus.textContent = `🔥 ${(t("streakBonus") || "{n} streak bonus").split("{n}").join(r.streakCount)} +${r.streakBonus}`;
    const expl = r.level.explanation;
    const explText = typeof expl === "string" ? expl : (expl && (expl[currentLang()] || expl.en)) || "";
    setMathText($completeExplanation, explText);
    $completeExplanation.hidden = !explText;
    $completeReview.hidden = true;

    // Systems levels (Today's Challenge too): graph both lines meeting at the answer
    // Straight lines (Today's Challenge too): the line, with its points or its y-intercept
    const graphShown = (r.level.topic === "system" && showSystemGraph(r.level))
      || (r.level.topic === "line" && showLineGraph(r.level));
    // Inequality levels (Today's Challenge too): the answer on a number line
    const lineShown = r.level.topic === "inequality" && showNumberLine(r.level);
    const graphLineKey = !graphShown ? "chalkyNumberLine" : r.level.topic === "line" ? "chalkyLineDrawn" : "chalkyLinesMeet";

    // Buttons: primary = Next level (or Level select / Home when there's nothing next)
    const next = r.daily ? null : nextLevelAfter(r.level);
    const toLevels = () => go(`#levels/${r.level.topic}`);
    if (r.daily) {
      completeActions = { primary: () => go("#home"), escape: () => go("#home") };
      $completePrimaryBtn.textContent = t("homeBtn") || "Home";
    } else if (next) {
      completeActions = { primary: () => go(playHash(next)), escape: toLevels };
      $completePrimaryBtn.textContent = t("nextLevelBtn") || "Next level →";
    } else {
      completeActions = { primary: toLevels, escape: toLevels };
      $completePrimaryBtn.textContent = t("levelSelectBtn") || "Level select";
    }
    completeActions.retry = () => go(playHash(r.level));
    completeActions.levels = toLevels;
    completeActions.watch = watchFromComplete;

    $completeRetryBtn.textContent = t("retryBtn") || "Try again";
    $completeLevelsBtn.textContent = t("levelSelectBtn") || "Level select";
    $completeRetryBtn.hidden = r.daily || r.stars === 3;
    $completeLevelsBtn.hidden = r.daily || !next;
    $completeRetryBtn.parentElement.hidden = $completeRetryBtn.hidden && $completeLevelsBtn.hidden;
    $completeWatchBtn.textContent = t("completeWatchBtn") || "See how it's solved";
    $completeWatchBtn.hidden = r.daily;

    // Press Start 2P has no Japanese glyphs — use it only for ASCII titles.
    $completeKicker.classList.toggle("pixel", /^[\x20-\x7E]*$/.test($completeKicker.textContent));
    $completeOverlay.hidden = false;
    $completePrimaryBtn.focus({ preventScroll: true });

    // Biggest moment wins: topic mastered > tier complete > Today's Challenge > normal clear
    if (r.topicJustMastered) completeChalky("celebrating", "chalkyTopicMastered", { topic: t(TOPIC_LABEL_KEYS[r.level.topic]) }, "celebratingHat");
    else if (r.tierJustCompleted) completeChalky("celebrating", "chalkyTierDone", { tier: tierName });
    else if (r.daily) completeChalky("celebrating", dailyStreak > 1 ? "chalkyDailyStreak" : "chalkyDaily", { n: dailyStreak });
    else if ((graphShown || lineShown) && !REDUCED_MOTION) {
      completeBuddy.react("thinking", { stay: true });   // watches it draw, then points out the answer
      afterGraphDrawn(() => completeChalky("happy", graphLineKey));
    }
    else if (graphShown || lineShown) completeChalky("happy", graphLineKey);
    else completeChalky("happy", r.stars === 3 ? "chalky3Star" : "chalkyFewerStars");

    if (r.topicJustMastered || r.tierJustCompleted || r.daily) burstGrandConfetti({ big: r.topicJustMastered });
    else if (r.streakBonus) sfx.streak();   // the fanfare already covers the big moments
  }

  function hideCompleteOverlay() { $completeOverlay.hidden = true; completeBuddy.stop(); clearSystemGraph(); clearNumberLine(); }

  $completePrimaryBtn.addEventListener("click", () => completeActions.primary && completeActions.primary());
  $completeRetryBtn.addEventListener("click", () => completeActions.retry && completeActions.retry());
  $completeLevelsBtn.addEventListener("click", () => completeActions.levels && completeActions.levels());
  $completeWatchBtn.addEventListener("click", () => completeActions.watch && completeActions.watch());
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$completeOverlay.hidden && completeActions.escape) completeActions.escape();
  });

  // ---------- per-level progress + stars ----------
  // 3★ = no hint and no wrong taps · 2★ = no hint · 1★ = solved
  function starsForCurrentAttempt() {
    if (hintUsedThisLevel) return 1;
    return wrongThisLevel === 0 ? 3 : 2;
  }

  // Saves the best result for this level; returns the stars earned this time.
  function recordLevelResult(level) {
    const stars = starsForCurrentAttempt();
    const prev = levelProgress[level.id];
    if (!prev || stars > prev.stars) levelProgress[level.id] = { stars };
    saveProgress();
    return stars;
  }

  function topicStats(topic) {
    const levels = LEVELS.filter(l => l.topic === topic);
    let cleared = 0, stars = 0;
    levels.forEach(l => {
      const p = levelProgress[l.id];
      if (p) { cleared++; stars += p.stars; }
    });
    return { total: levels.length, cleared, stars, maxStars: levels.length * 3 };
  }

  function statsText({ total, cleared, stars, maxStars }) {
    const label = LLL_I18N.t("clearedLabel") || "cleared";
    return `${cleared} / ${total} ${label} · ★ ${stars} / ${maxStars}`;
  }

  function updateHomeCards() {
    document.querySelectorAll(".topic-card-progress").forEach(el => {
      const stats = topicStats(el.dataset.progress);
      el.querySelector(".topic-card-bar-fill").style.width = `${(stats.cleared / stats.total) * 100}%`;
      el.querySelector(".topic-card-count").textContent = statsText(stats);
    });
  }

  // ---------- mixed review ----------
  // A session = a queue of levels played back to back, then a summary.
  // buildReviewQueue() takes any pool + length, so checkpoints can reuse it later.
  const REVIEW_LENGTH = 10;   // levels per session
  const REVIEW_UNLOCK = 10;   // cleared levels needed before Mixed Review opens

  function shuffled(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function clearedLevels() { return LEVELS.filter(l => levelProgress[l.id]); }

  // Picks n levels with no repeats, one topic at a time (round-robin), so a session
  // isn't dominated by whichever topic has the most cleared levels.
  function buildReviewQueue(pool, n) {
    const byTopic = {};
    shuffled(pool).forEach(l => (byTopic[l.topic] ||= []).push(l));
    const topics = shuffled(Object.keys(byTopic));
    const picks = [];
    while (picks.length < n && topics.some(tp => byTopic[tp].length)) {
      for (const tp of topics) {
        if (picks.length >= n) break;
        const l = byTopic[tp].pop();
        if (l) picks.push(l);
      }
    }
    return shuffled(picks);
  }

  function updateReviewCard() {
    const t = (k, fb) => LLL_I18N.t(k) || fb;
    const cleared = clearedLevels().length;
    const locked = cleared < REVIEW_UNLOCK;
    $reviewCard.disabled = locked;
    $reviewCard.classList.toggle("locked", locked);
    if (locked) {
      $reviewCardStatus.textContent =
        t("reviewLocked", "🔒 Clear {n} more levels to unlock").split("{n}").join(REVIEW_UNLOCK - cleared);
    } else {
      const ready = t("reviewReady", "{n} questions from all topics").split("{n}").join(REVIEW_LENGTH);
      // Non-breaking spaces keep "Best 110 pts" together when the line wraps on narrow screens
      const best = reviewBest
        ? ` · ${t("reviewBest", "Best {n} pts").split("{n}").join(reviewBest).replace(/ /g, "\u00A0")}`
        : "";
      $reviewCardStatus.textContent = ready + best;
    }
  }

  $reviewCard.addEventListener("click", () => {
    if (!$reviewCard.disabled) go("#review");
  });

  function startReview() {
    review = { levels: buildReviewQueue(clearedLevels(), REVIEW_LENGTH), index: 0, score: 0, results: [] };
    stepIndex = 0;
    render();
  }

  // Runs when the last step of a review level is solved. Stars, streak and achievements are left alone.
  function finishReviewLevel(correctStep) {
    const level = currentLevel();
    review.score += level.basePoints;
    review.results.push({ topic: level.topic, clean: !hintUsedThisLevel && wrongThisLevel === 0 });
    $hudScore.textContent = review.score;
    const session = review;
    setTimeout(() => {
      if (review !== session) return;   // player left or restarted in the meantime
      review.index++;
      if (review.index < review.levels.length) { stepIndex = 0; render(); }
      else if (review.practice) showPracticeSummary();
      else showReviewSummary();
    }, correctStep.flip ? 1500 : 900);
  }

  function showReviewSummary() {
    const t = (k, fb) => LLL_I18N.t(k) || fb;
    const { score: sessionScore, results } = review;
    const flawless = results.filter(r => r.clean).length;
    const newBest = reviewBest > 0 && sessionScore > reviewBest;
    if (sessionScore > reviewBest) { reviewBest = sessionScore; saveProgress(); }
    unlockAchievement("review_first");
    if (flawless === results.length) unlockAchievement("review_clean");

    $completeKicker.textContent = t("reviewComplete", "Review complete!");
    $completeSub.textContent = t("reviewTitle", "Mixed Review");
    $completeStars.hidden = true;
    $completeBest.hidden = !newBest;
    $completeBest.textContent = t("newBest", "New best!");
    $completePoints.textContent = `${sessionScore} ${t("ptsLabel", "pts")}`;
    $completeBonus.hidden = true;
    $completeExplanation.hidden = true;
    clearSystemGraph();
    clearNumberLine();

    // One row per topic that came up, in home-screen order: ✓ = flawless, ✗ = hint or wrong move
    const marksByTopic = {};
    results.forEach(r => (marksByTopic[r.topic] ||= []).push(r.clean));
    const topics = Object.keys(TOPIC_LABEL_KEYS).filter(tp => marksByTopic[tp]);
